function dueColor(b){
  if(b.paid) return "var(--green)";
  if(!b.due) return "var(--dim)";
  // If viewing a future month, nothing is overdue — compare against that month's calendar.
  const off=S.viewMonthOffset||0;
  if(off>0) return "var(--dim)";
  if(b.due<todayDay) return "var(--red)";
  if(b.due-todayDay<=3) return "var(--amber)";
  return "var(--dim)";
}

// Stepping the viewed month is just a view change — fully reversible, both directions,
// independent of the undo stack. It never resets bills; that's advanceMonth() only.
function stepViewMonth(dir){
  const cur=S.viewMonthOffset||0;
  const next=cur+dir;
  if(next<0) return; // don't view months before the current real month
  S.viewMonthOffset=next;
  persist(); render();
}
function jumpToCurrentMonth(){ S.viewMonthOffset=0; persist(); render(); }
function advanceMonthPrompt(){
  const allPaid=S.monthly.every(b=>b.paid);
  const msg=allPaid?"Start next month? Every bill resets to unpaid and spending budgets reset for the new cycle. You can undo this from the profile menu."
                   :"Not all bills are paid yet. Start next month anyway? Unpaid bills will reset. You can undo this from the profile menu.";
  if(confirm(msg)) advanceMonth();
}

function annualTab(c){
  if(!S.annual.length) return `<div class="empty">No annual bills yet.<br>Tap + to add one.</div>`;
  const rows=[...S.annual].sort((a,b)=>a.date.localeCompare(b.date)).map(b=>`
    <div class="row-item" onclick="openEdit('annual',${b.id})">
      <button class="chk ${b.paid?"on":""}" onclick="event.stopPropagation();togglePaid('annual',${b.id})">${b.paid?"✓":""}</button>
      <div style="flex:1">
        <div class="name" style="${b.paid?"text-decoration:line-through;opacity:.55":""}">${esc(b.name)}</div>
        <div class="sub">${new Date(b.date+"T12:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">${b.url?`<button class="btn ghost" style="padding:5px 9px;font-size:13px" onclick="openExt('${esc(b.url)}',event)">↗</button>`:""}<div class="amt" style="${b.paid?"opacity:.5":""}">${fmt(b.amt)}</div></div>
    </div>`).join("");
  return `
    <div class="mono d" style="font-size:13px;margin:6px 0 12px">${fmt(c.aLeft)} left of ${fmt(c.aTotal)} this year</div>
    ${bar(((c.aTotal-c.aLeft)/(c.aTotal||1))*100,"var(--green)")}
    <div style="height:14px"></div>${rows}`;
}

let debtSort="payoff";
function setDebtSort(v){ debtSort=v; render(true); }
function debtTab(c){
  const cards=S.credit.filter(x=>x.debt>0).map(x=>({...x,kind:"credit",type:"Card"}));
  const loans=S.monthly.filter(b=>(b.debt||0)>0&&!b.link).map(b=>({...b,kind:"monthly",type:"Loan",apr:b.apr||0}));
  let all=[...cards,...loans];
  if(!all.length) return `<div class="empty">No debt tracked. 🎉<br>Card debts and loan balances show here.</div>`;
  // Recommended order: what each debt actually costs you per month (balance × APR),
  // with a bump for balances you could clear quickly — those free up cash flow fast.
  const monthlyBleed=x=>(x.debt||0)*(effectiveApr(x)||0)/1200;
  const quickWin=x=>{
    const pay=x.kind==="monthly"?payAmt(x):0;
    if(pay<=0) return false;
    const n=payoffMonths(x.debt,x.apr||0,pay);
    return n!==null&&n<=3;
  };
  const payoffScore=x=>{
    let score=monthlyBleed(x);
    if(quickWin(x)) score+=1000;                 // clearable in ~3 months → do it now
    if((x.debt||0)>0&&(x.apr||0)===0) score+=0;  // 0% debt has no urgency
    return score;
  };
  const sorters={
    payoff:(a,b)=>payoffScore(b)-payoffScore(a)||b.apr-a.apr,
    name:(a,b)=>a.name.localeCompare(b.name),
    amtHigh:(a,b)=>b.debt-a.debt,
    amtLow:(a,b)=>a.debt-b.debt,
    apr:(a,b)=>b.apr-a.apr,
    section:(a,b)=>a.type.localeCompare(b.type)||b.apr-a.apr,
  };
  all.sort(sorters[debtSort]||sorters.payoff);
  const totalDebt=all.reduce((s,x)=>s+x.debt,0);
  const mi=all.reduce((s,x)=>s+x.debt*(x.apr||0)/100/12,0);
  const row=(x,i)=>{
    const m=x.debt*(x.apr||0)/100/12;
    return `<div class="row-item" style="border-left:3px solid ${x.apr>20?"var(--red)":x.apr>0?"var(--amber)":"var(--green)"}" onclick="openEdit('${x.kind}',${x.id})">
      ${debtSort==="payoff"?`<div class="mono d" style="font-size:18px;font-weight:700;width:24px">${i+1}</div>`:""}
      <div style="flex:1">
        <div class="name">${esc(x.name)}${x.last4?` <span class="mono d" style="font-size:11px">••${esc(x.last4)}</span>`:""}${x.link?'<span class="lnk">⟲</span>':""}<span class="chip">${x.type}</span>${x.hcat?`<span class="chip p">${esc(titleCase(x.hcat))}</span>`:""}</div>
        <div class="sub">${x.apr||0}% APR${m>0.01?` <span class="a">· ~${fmt(m)}/mo interest</span>`:""}${debtSort==="payoff"&&quickWin(x)?' <span class="g">· quick win</span>':""}${x.note?" · "+esc(x.note):""}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">${x.url?`<button class="btn ghost" style="padding:4px 8px;font-size:12px" onclick="openExt('${esc(x.url)}',event)">↗</button>`:""}<div class="amt r">${fmt(x.debt)}</div></div>
    </div>`;
  };
  let rows;
  if(debtSort==="section"){
    const grp=t=>all.filter(x=>x.type===t);
    rows=["Card","Loan"].map(t=>{
      const g=grp(t);
      return g.length?`<div class="sec">${t==="Card"?"Credit cards":"Loans"} · ${fmt(g.reduce((s,x)=>s+x.debt,0))}</div>${g.map(row).join("")}`:"";
    }).join("");
  } else rows=all.map(row).join("");
  return `
    <div class="card">
      ${krow("Total debt (cards + loans)",fmt(totalDebt),"r")}
      ${krow("Interest cost per month (approx)",fmt(mi),"a")}
      ${krow("Per year if balances stay flat",fmt(mi*12),"a")}
      ${debtSort==="payoff"?'<div class="hint" style="margin-top:6px">Ranked by what each balance actually costs per month (balance × APR), with anything you could clear in about 3 months pushed to the top. Extra dollars go to #1, minimums on the rest.</div>':""}
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin:0 0 10px">
      <span class="hint">Sort by</span>
      <select style="flex:1;max-width:230px" onchange="setDebtSort(this.value)">
        <option value="payoff" ${debtSort==="payoff"?"selected":""}>Recommended payoff order</option>
        <option value="name" ${debtSort==="name"?"selected":""}>Name</option>
        <option value="amtHigh" ${debtSort==="amtHigh"?"selected":""}>Amount (highest first)</option>
        <option value="amtLow" ${debtSort==="amtLow"?"selected":""}>Amount (lowest first)</option>
        <option value="apr" ${debtSort==="apr"?"selected":""}>APR</option>
        <option value="section" ${debtSort==="section"?"selected":""}>Section (cards / loans)</option>
      </select>
    </div>
    ${rows}`;
}

function investTab(c){
  if(!S.invest.length) return `<div class="empty">No investments yet.<br>Tap + to add accounts with balances and goals.</div>`;
  const rows=S.invest.map(v=>{
    const pct=v.goal?(v.amt/v.goal)*100:0;
    return `<div class="card" style="padding:12px;margin-bottom:8px;cursor:pointer" onclick="openEdit('invest',${v.id})">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <div class="name">${esc(v.name)}${v.link?'<span class="lnk">⟲</span>':""}${v.apy>0?`<span class="b mono" style="font-size:11px;margin-left:6px">${v.apy}% APY</span>`:""}</div>
        <div style="display:flex;align-items:center;gap:8px">${v.url?`<button class="btn ghost" style="padding:4px 8px;font-size:12px" onclick="openExt('${esc(v.url)}',event)">↗</button>`:""}<div class="mono" style="font-size:14px;font-weight:600">${fmt(v.amt)}</div></div>
      </div>
      ${bar(pct,pct>=100?"var(--blue)":"var(--green)")}
      <div class="hint mono" style="margin-top:5px">${pct<1?pct.toFixed(2):pct.toFixed(1)}% of ${fmtShort(v.goal)}</div>
    </div>`;
  }).join("");
  return `<div class="mono d" style="font-size:13px;margin:6px 0 14px">Portfolio total: <span class="g" style="font-weight:700">${fmt(c.iTotal)}</span></div>${rows}`;
}

function accountsTab(c){
  const cashRow=a=>`
    <div class="row-item" style="justify-content:space-between" onclick="openEdit('cash',${a.id})">
      <div>
        <div class="name">${esc(a.name)}${a.last4?` <span class="mono d" style="font-size:11px">${a.l4type==="card"?"Card":"Acct"} ••${esc(a.last4)}</span>`:""}${a.link?'<span class="lnk">⟲</span>':""}</div>
        ${(a.tag||a.apy>0)?`<div style="font-size:11px" class="b">${esc(a.tag||"")}${(a.tag&&a.apy>0)?" · ":""}${a.apy>0?`<span class="g">${a.apy}% APY</span>`:""}</div>`:""}
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        ${a.url?`<button class="btn ghost" style="padding:5px 9px;font-size:13px" onclick="openExt('${esc(a.url)}',event)">↗</button>`:""}
        <div class="amt">${fmt(a.amt)}</div>
      </div>
    </div>`;
  const checking=S.cash.filter(a=>!a.savings);
  const savings=S.cash.filter(a=>a.savings);
  const cashRows=`
    ${checking.length?`<div class="sec">Checking &amp; spending · ${fmt(checking.reduce((s,a)=>s+a.amt,0))}</div>${checking.map(cashRow).join("")}`:""}
    ${savings.length?`<div class="sec" style="color:var(--purple)">Savings · ${fmt(c.savingsTotal)}</div>${savings.map(cashRow).join("")}`:""}`;
  const ccRows=S.credit.map(x=>{
    const util=x.limit?(x.debt/x.limit)*100:0;
    return `<div class="card" style="padding:12px;margin-bottom:8px;cursor:pointer" onclick="openEdit('credit',${x.id})">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <div class="name">${esc(x.name)}${x.last4?` <span class="mono d" style="font-size:11px">••${esc(x.last4)}</span>`:""}${x.link?'<span class="lnk">⟲</span>':""}<span class="mono ${x.apr>20?"r":"d"}" style="font-size:11px;margin-left:6px">${x.apr}% APR</span></div>
        <div style="display:flex;align-items:center;gap:8px">${x.url?`<button class="btn ghost" style="padding:4px 8px;font-size:12px" onclick="openExt('${esc(x.url)}',event)">↗</button>`:""}<div class="mono" style="font-size:13px"><span class="${x.debt>0?"r":"g"}" style="font-weight:600">${fmt(x.debt)}</span><span class="d"> / ${fmtShort(x.limit)}</span></div></div>
      </div>
      ${bar(util,util>60?"var(--red)":util>30?"var(--amber)":"var(--green)")}
      ${x.note?`<div class="hint" style="margin-top:5px">${esc(x.note)}</div>`:""}
    </div>`;
  }).join("");
  const empty=!S.cash.length&&!S.credit.length;
  if(empty) return `<div class="empty">No accounts yet.<br>Tap + for a cash account, or "+ Credit card".</div>`;
  return `
    ${S.cash.length?cashRows:""}
    ${S.credit.length?`<div class="sec" style="margin-top:20px">Credit · ${fmt(c.ccDebt)} owed / ${fmtShort(c.ccLimit)} limit</div>${ccRows}`:""}`;
}

// ---------- main render ----------
const TABS=[["budget","Budget"],["monthly","Monthly"],["annual","Annual"],["debt","Debt"],["invest","Investments"],["accounts","Accounts"]];
function render(keepScroll){
  const y=keepScroll?window.scrollY:null;
  const c=calc();
  let content="";
  if(tab==="budget") content=budgetTab(c);
  else if(tab==="monthly") content=monthlyTab(c);
  else if(tab==="annual") content=annualTab(c);
  else if(tab==="debt") content=debtTab(c);
  else if(tab==="invest") content=investTab(c);
  else content=accountsTab(c);
  const fab=`<button class="fab" onclick="openAddMenu()">+</button>`;
  const fab2="";
  const alertHtml=activeAlerts.length?`<div class="alertbox">⚠ ${activeAlerts.map(a=>esc(a.body)).join("<br>⚠ ")}</div>`:"";
  document.getElementById("app").innerHTML=`
    <div class="hdr">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div style="min-width:0">
          <div style="font-size:17px;font-weight:700">${S.profile.nick?`Welcome back, ${esc(S.profile.nick)}`:"Welcome"}</div>
          <div class="eyebrow" style="margin-top:2px">Ledger · ${new Date().toLocaleDateString("en-US",{month:"long",day:"numeric"})}</div>
        </div>
        <button class="pfp" onclick="openMenu()" aria-label="Profile">${pfpHTML(38)}</button>
      </div>
      <div class="stats" id="hdrStats">${hdrStatsHTML(c)}</div>
    </div>
    ${S.__undo?`<div class="banner" style="border-color:var(--blue);color:var(--blue);display:flex;justify-content:space-between;align-items:center;gap:10px">
      <span>Budget rebalanced · backup saved</span>
      <span style="display:flex;gap:6px">
        <button class="btn ghost" style="width:auto;padding:4px 10px;font-size:11px" onclick="rebalanceUndo()">Undo</button>
        <button class="btn" style="width:auto;padding:4px 10px;font-size:11px" onclick="rebalanceKeep()">Keep</button>
      </span></div>`:""}
    ${banner?`<div class="banner" onclick="dismissBanner()">${esc(banner)} · tap to dismiss</div>`:""}
    ${alertHtml}
    <div class="tabs">${TABS.map(([k,l])=>`<button class="tab ${tab===k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("")}</div>
    <div class="wrap">${content}</div>
    ${fab}${fab2}`;
  applyTheme();
  if(y!=null) window.scrollTo(0,y);
}

document.addEventListener("focusin",e=>{
  if(e.target&&/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){
    setTimeout(()=>{ try{ e.target.scrollIntoView({block:"center",behavior:"smooth"}); }catch(_){}}, 250);
  }
});
S=load(); persist();
S.viewMonthOffset=0;  // always open on the real current month; month nav is view-only
archiveExpiredSchedules();
syncAnnualToMonthly();
checkAlerts();
render();
setInterval(checkAlerts,30*60*1000);
</script>
</body>
