<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0F14">
<title>Ledger</title>
<style>
  :root{
    --bg:#0C0F14;--panel:#141922;--panel2:#1A2130;--line:#232B3A;
    --text:#E8EDF4;--dim:#8B95A7;--green:#5EEAA0;--amber:#F5C452;
    --red:#F4746B;--blue:#6FA8FF;--purple:#B79BFF;
    --mono:'SF Mono','Cascadia Code','JetBrains Mono',ui-monospace,Menlo,monospace;
    --sans:'Avenir Next','Segoe UI',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
  .hdr{padding:calc(44px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  .stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
  .stat-l{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
  .stat-v{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:2px}
  .tabs{display:flex;gap:6px;padding:12px 16px;overflow-x:auto}
  .tab{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:7px 16px;font-size:13px;font-weight:600;white-space:nowrap;font-family:var(--sans)}
  .tab.on{background:var(--panel2);border-color:var(--blue);color:var(--text)}
  .wrap{padding:0 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .row-item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .bar>div{height:100%;border-radius:3px;transition:width .4s ease}
  .chk{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--dim);background:transparent;color:var(--green);font-size:14px;flex-shrink:0}
  .chk.on{border-color:var(--green);background:rgba(94,234,160,.15)}
  .name{font-weight:600;font-size:14px}
  .sub{font-size:11px;color:var(--dim);margin-top:2px}
  .amt{font-family:var(--mono);font-weight:600;font-size:15px}
  .chip{font-size:10px;color:var(--blue);margin-left:6px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap}
  .chip.p{color:var(--purple)}
  .lnk{color:var(--purple);font-size:11px;margin-left:6px}
  .krow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0}
  .krow.top{border-top:1px solid var(--line)}
  .krow .kl{font-size:12px;color:var(--dim)}
  .krow .kv{font-family:var(--mono);font-size:13px;font-weight:600}
  .krow.big .kl{font-size:14px;color:var(--text);font-weight:700}
  .krow.big .kv{font-size:18px;font-weight:700}
  .hint{font-size:11px;color:var(--dim)}
  .btn{background:rgba(111,168,255,.15);border:1px solid var(--blue);color:var(--blue);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;font-family:var(--sans)}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--dim)}
  .btn.danger{background:rgba(244,116,107,.15);border-color:var(--red);color:var(--red)}
  .btn.green{background:rgba(94,234,160,.15);border-color:var(--green);color:var(--green)}
  button{cursor:pointer}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font-family:var(--mono);font-size:14px;outline:none;width:100%}
  .fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
  .fld span{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
  .fab{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom,0px));right:20px;width:56px;height:56px;border-radius:28px;background:var(--blue);color:#0C0F14;font-size:30px;border:none;box-shadow:0 4px 20px rgba(111,168,255,.4);font-weight:700;z-index:5;display:flex;align-items:center;justify-content:center;line-height:1}
  .fab2{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom,0px));right:88px;height:56px;border-radius:28px;padding:0 18px;background:var(--panel2);color:var(--text);font-size:13px;font-weight:700;border:1px solid var(--line);z-index:5}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:10}
  .sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px));width:100%;max-height:80vh;overflow-y:auto}
  .sheet.centered{border:1px solid var(--line);border-radius:16px;width:min(460px,94vw);max-height:82vh;margin:auto}
  .sheet h3{font-size:16px;margin-bottom:16px}
  .frm{display:flex;flex-wrap:wrap;gap:12px}
  .banner{margin:10px 16px 0;padding:8px 12px;background:rgba(111,168,255,.1);border:1px solid var(--blue);border-radius:8px;font-size:12px;color:var(--blue);cursor:pointer}
  .alertbox{margin:10px 16px 0;padding:8px 12px;background:rgba(245,196,82,.1);border:1px solid var(--amber);border-radius:8px;font-size:12px;color:var(--amber)}
  .adj{margin-top:16px;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
  .adj .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:8px}
  .adjbtn{width:44px;height:44px;border-radius:10px;font-size:22px;font-weight:700}
  .adjbtn.m{border:1.5px solid var(--red);background:rgba(244,116,107,.12);color:var(--red)}
  .adjbtn.p{border:1.5px solid var(--green);background:rgba(94,234,160,.12);color:var(--green)}
  .sec{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:10px 0 8px}
  .logrow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
  .g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}.p{color:var(--purple)}.b{color:var(--blue)}.d{color:var(--dim)}
  .mono{font-family:var(--mono)}
  .empty{text-align:center;padding:30px 16px;color:var(--dim);font-size:13px}
  body.light{
    --bg:#EFF2F7;--panel:#FFFFFF;--panel2:#E9EDF4;--line:#D4DAE4;
    --text:#1A2130;--dim:#5C6675;--green:#118A56;--amber:#A56A00;
    --red:#C64040;--blue:#2563EB;--purple:#6D4FC4;
  }
  .pfp{width:44px;height:44px;border-radius:22px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;flex-shrink:0}
  .pfp img{width:100%;height:100%;object-fit:cover}
  .menu{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(320px,88vw);padding:8px;margin:auto}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);font-family:var(--sans);font-size:15px;font-weight:600;padding:13px 12px;border-bottom:1px solid var(--line)}
  .menu button:last-child{border-bottom:none}
  .overlay.center{align-items:center;justify-content:center}
  .stubtbl{width:100%;font-size:12px}
  .stubtbl .trow{display:flex;gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}
  .stubtbl .thead{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetHost"></div>
<script>
"use strict";
const KEY = "ledger-blank-v1";
const FREQ = { weekly:{per:52,label:"Weekly"}, biweekly:{per:26,label:"Every 2 weeks"}, semimonthly:{per:24,label:"Twice a month"}, monthly:{per:12,label:"Monthly"} };
const SEED = {
  monthKey: "",
  settings: { notif:false, lowBal:50, ccPct:30, dueDays:3, theme:"dark", overBudget:true, obSuggest:false },
  profile: { photo:"", name:"", nick:"", email:"", phone:"" },
  payAnchor: "",
  jobs: [],
  expenseNames: [],
  misc: [],
  health: [],
  transport: [],
  healthYear: 0,
  healthLog: [],
  monthly: [],
  annual: [],
  invest: [],
  cash: [],
  credit: [],
  log: [],
  notified: {},
};

// ---------- helpers ----------
const fmt = n => "$" + Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtShort = n => { n=Number(n||0); if(n>=1e6) return "$"+(n/1e6).toFixed(1)+"M"; if(n>=1e4) return "$"+Math.round(n/1e3)+"k"; return fmt(n); };
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
// Title Case for names (each word capitalized). Preserves all-caps acronyms up to 3 chars and $/numbers.
const titleCase = s => String(s??"").trim().split(/\s+/).map(w=>{
  if(!w) return w;
  if(/^[A-Z0-9&./-]{1,3}$/.test(w)) return w; // ASH, RH, CC, 401k-ish short tokens
  if(/^\$?\d/.test(w)) return w;
  return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
}).join(" ");
const monthKeyNow = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const dayKey = () => new Date().toISOString().slice(0,10);
const todayDay = new Date().getDate();
const ord = n => n + (["st","nd","rd"][((n+90)%100-10)%10-1]||"th");
const fmtDate = s => s ? new Date(s+"T12:00").toLocaleDateString("en-US",{month:"numeric",day:"numeric",year:"2-digit"}) : "";
function nextPayday(a){ if(!a) return null; const d=new Date(a+"T12:00"); const now=new Date(); now.setHours(0,0,0,0); while(d<now) d.setDate(d.getDate()+14); return d; }
const FREQ_DAYS={weekly:7,biweekly:14,semimonthly:15,monthly:30};
function nextPaydayFreq(anchor,freq){
  if(!anchor) return null;
  const step=FREQ_DAYS[freq]||14;
  const d=new Date(anchor+"T12:00"); const now=new Date(); now.setHours(0,0,0,0);
  if(freq==="monthly"){ while(d<now){ d.setMonth(d.getMonth()+1); } return d; }
  if(freq==="semimonthly"){ while(d<now){ d.setDate(d.getDate()+15); } return d; }
  while(d<now) d.setDate(d.getDate()+step);
  return d;
}
// soonest upcoming payday across all active jobs (falls back to global anchor)
function soonestPayday(){
  const cands=[];
  S.jobs.filter(j=>!j.archived&&j.payAnchor).forEach(j=>{ const p=nextPaydayFreq(j.payAnchor,j.freq); if(p) cands.push({date:p,job:j}); });
  if(!cands.length){ const p=nextPayday(S.payAnchor); return p?{date:p,job:null}:null; }
  cands.sort((a,b)=>a.date-b.date);
  return cands[0];
}
function allJobPaydays(){
  return S.jobs.filter(j=>!j.archived&&j.payAnchor).map(j=>({job:j,date:nextPaydayFreq(j.payAnchor,j.freq)})).filter(x=>x.date).sort((a,b)=>a.date-b.date);
}
const VALUE_FIELD = { monthly:"debt", credit:"debt", cash:"amt", invest:"amt" };

// ---------- state ----------
let S, tab="budget", editing=null, F=null, banner="", backupStatus="", activeAlerts=[];

function migrate(d){
  const base=JSON.parse(JSON.stringify(SEED));
  d={...base,...d};
  d.settings={...base.settings,...(d.settings||{})};
  d.profile={...base.profile,...(d.profile||{})};
  d.jobs=(d.jobs||[]).map(j=>({rates:[],stubs:[],pct:0,freq:"biweekly",archived:false,title:"",type:"pt",payAnchor:"",labelRates:[],schedule:[],scheduleArchive:[],...j}));
  if(!d.health) d.health=[];
  if(!d.transport) d.transport=[];
  if(d.healthYear===undefined) d.healthYear=0;
  if(!d.healthLog) d.healthLog=[];
  if(d.viewMonthOffset===undefined) d.viewMonthOffset=0;
  const mk=monthKeyNow();
  if(d.monthKey && d.monthKey!==mk){
    d.monthly=d.monthly.map(b=>({...b,paid:false,schedAmt:0,schedDate:""}));
    // last month's auto-added annual bills don't carry into the new month
    d.monthly=d.monthly.filter(b=>!b.fromAnnual||b.forMonth===mk);
    d.misc=d.misc.map(m=>({...m,spent:0}));
    d.health=(d.health||[]).map(m=>({...m,spent:0}));
    d.transport=(d.transport||[]).map(m=>({...m,spent:0}));
    banner="New month — bills unchecked, spending budgets reset";
  }
  d.monthKey=mk;
  return d;
}
// An annual bill whose due date lands in the current month gets mirrored into the
// monthly list for that month, so it shows up alongside everything else that's due.
function syncAnnualToMonthly(){
  const mk=monthKeyNow();
  const now=new Date();
  let added=0;
  (S.annual||[]).forEach(ab=>{
    if(!ab.date) return;
    const d=new Date(ab.date+"T12:00");
    if(d.getFullYear()!==now.getFullYear()||d.getMonth()!==now.getMonth()) return;
    const already=S.monthly.some(b=>b.fromAnnual===ab.id&&b.forMonth===mk);
    if(already) return;
    S.monthly.push({...BLANK.monthly,id:Date.now()+Math.random(),name:ab.name,due:d.getDate(),
      minAmt:ab.amt,amt:ab.amt,paid:!!ab.paid,url:ab.url||"",fromAnnual:ab.id,forMonth:mk});
    added++;
  });
  if(added){ persist(); banner=`${added} annual bill${added>1?"s":""} added to this month's bills`; }
}
function load(){
  let d;
  try{ const r=localStorage.getItem(KEY); d = r ? JSON.parse(r) : JSON.parse(JSON.stringify(SEED)); }
  catch(e){ d=JSON.parse(JSON.stringify(SEED)); }
  return migrate(d);
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
// ---------- undo / redo ----------
// Snapshot stacks hold JSON of S from BEFORE each user action. checkpoint() is
// called at the start of a mutating action; undo pops back, redo re-applies.
let undoStack=[], redoStack=[];
const UNDO_MAX=40;
function stripTransient(obj){ const c={...obj}; delete c.__undo; return c; }
function checkpoint(){
  try{ undoStack.push(JSON.stringify(stripTransient(S))); if(undoStack.length>UNDO_MAX) undoStack.shift(); redoStack=[]; }catch(e){}
}
function canUndo(){ return undoStack.length>0; }
function canRedo(){ return redoStack.length>0; }
function doUndo(){
  if(!undoStack.length) return;
  try{
    redoStack.push(JSON.stringify(stripTransient(S)));
    const prev=undoStack.pop();
    S=migrate(JSON.parse(prev));
    persist(); checkAlerts(); render();
    banner="Undone"; render();
  }catch(e){ alert("Couldn't undo."); }
}
function doRedo(){
  if(!redoStack.length) return;
  try{
    undoStack.push(JSON.stringify(stripTransient(S)));
    const next=redoStack.pop();
    S=migrate(JSON.parse(next));
    persist(); checkAlerts(); render();
    banner="Redone"; render();
  }catch(e){ alert("Couldn't redo."); }
}
function addLog(e){ S.log=[{id:Date.now()+Math.random(),ts:Date.now(),...e},...(S.log||[])].slice(0,200); }
function propagateLink(link,value){
  if(!link) return;
  ["monthly","credit","cash","invest"].forEach(k=>{ S[k]=S[k].map(x=>x.link===link?{...x,[VALUE_FIELD[k]]:value}:x); });
}

// ---------- calc ----------
// Recommended monthly payment for a debt bill: enough to clear the balance in
// PAYOFF_TARGET months, never below the minimum due. Non-debt bills just use the minimum.
const PAYOFF_TARGET=24;
// A bill and a credit-card record can be linked (same balance). The APR may only be
// filled in on one of them — resolve the real rate by checking the linked partner.
function effectiveApr(b){
  if(Number(b.apr||0)>0) return Number(b.apr);
  if(b.link){
    for(const k of ["credit","monthly"]){
      const partner=(S[k]||[]).find(x=>x.link===b.link&&Number(x.apr||0)>0);
      if(partner) return Number(partner.apr);
    }
  }
  return Number(b.apr||0);
}
function recommendPay(b){
  const min=Number(b.minAmt||0), debt=Number(b.debt||0), apr=effectiveApr(b);
  if(debt<=0) return min;
  const r=apr/100/12;
  let p;
  if(r<=0) p=debt/PAYOFF_TARGET;
  else p=debt*r/(1-Math.pow(1+r,-PAYOFF_TARGET));
  p=Math.ceil(p);
  return Math.max(min,p);
}
// Months to clear a balance at a given payment (null = never / interest outruns payment)
function payoffMonths(debt,apr,pay){
  debt=Number(debt||0); pay=Number(pay||0);
  if(debt<=0||pay<=0) return 0;
  const r=Number(apr||0)/100/12;
  if(r<=0) return Math.ceil(debt/pay);
  if(pay<=debt*r) return null;
  return Math.ceil(-Math.log(1-debt*r/pay)/Math.log(1+r));
}
function totalInterest(debt,apr,pay){
  const n=payoffMonths(debt,apr,pay);
  if(n===null) return null;
  return Math.max(0,pay*n-debt);
}
// What this bill actually costs each month:
// a scheduled one-off override wins, then your own budgeted number, then the recommendation.
function payAmt(b){
  if(b.schedAmt>0) return b.schedAmt;
  if(Number(b.amt||0)>0) return Number(b.amt);
  return recommendPay(b);
}
function recPanel(){ const el=document.getElementById("recPanel"); if(el) el.innerHTML=recPanelHTML(); }
// Account/card picker used by budget categories — "spends from" default.
function acctPickerHTML(){
  return `<label class="fld" style="min-width:150px"><span>Spends from</span>
    <select onchange="fSet('acct',this.value)">
      <option value="">— not assigned —</option>
      ${S.cash.length?`<optgroup label="Bank accounts">${S.cash.map(a=>`<option value="cash:${a.id}" ${F.acct==="cash:"+a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</optgroup>`:""}
      ${S.credit.length?`<optgroup label="Credit cards">${S.credit.map(x=>`<option value="credit:${x.id}" ${F.acct==="credit:"+x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</optgroup>`:""}
    </select></label>`;
}
// Resolve an "cash:12345" / "credit:678" reference to its display name
function acctName(ref){
  if(!ref) return "";
  const [k,idRaw]=String(ref).split(":"); const id=Number(idRaw);
  const it=(k==="cash"?S.cash:S.credit).find(x=>x.id===id);
  return it?it.name:"";
}
function recPanelHTML(){
  const debt=Number(F.debt||0), apr=effectiveApr(F), min=Number(F.minAmt||0);
  const aprFromLink=(Number(F.apr||0)===0 && apr>0);
  const rec=recommendPay(F), using=payAmt(F);
  const src=F.schedAmt>0?"scheduled override":(Number(F.amt||0)>0?"your number":"recommended");
  if(debt<=0){
    if(min<=0) return "";
    return `<div style="width:100%;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-bottom:2px">
      <div class="hint">No balance owed, so the recommendation is just the minimum: <b class="g">${fmt(min)}</b>. Currently using <b>${esc(src)}</b> — ${fmt(using)}/mo.</div></div>`;
  }
  const nMin=payoffMonths(debt,apr,min), iMin=totalInterest(debt,apr,min);
  const nRec=payoffMonths(debt,apr,rec), iRec=totalInterest(debt,apr,rec);
  const nUse=payoffMonths(debt,apr,using), iUse=totalInterest(debt,apr,using);
  const mos=n=>n===null?"never at this rate":(n>=12?`${Math.floor(n/12)}y ${n%12}m`:`${n} mo`);
  const saved=(iMin!==null&&iUse!==null)?iMin-iUse:null;
  return `<div style="width:100%;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-bottom:2px">
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--blue);margin-bottom:8px">Payment recommendation</div>
    ${min>0?krow("At the minimum "+fmt(min),mos(nMin)+(iMin!==null?` · ${fmt(iMin)} interest`:"")):""}
    ${krow("Recommended "+fmt(rec),mos(nRec)+(iRec!==null?` · ${fmt(iRec)} interest`:""),"g")}
    ${krow("Using ("+esc(src)+")",fmt(using),"b",true,true)}
    ${saved!==null&&saved>0.5?`<div class="hint" style="margin-top:6px">That saves about <b class="g">${fmt(saved)}</b> in interest versus paying the minimum.</div>`:""}
    ${aprFromLink?`<div class="hint" style="margin-top:6px;color:var(--blue)">Using ${apr}% APR from the linked card. Set it here too if you want it stored on this bill.</div>`:""}
    <div class="hint" style="margin-top:6px">Recommendation clears the balance in about ${PAYOFF_TARGET} months. Leave your own number blank to use it.</div>
  </div>`;
}
function calc(){
  const eff=b=>payAmt(b);
  const mTotal=S.monthly.reduce((s,b)=>s+eff(b),0);
  const mLeft=S.monthly.filter(b=>!b.paid).reduce((s,b)=>s+eff(b),0);
  const mDebt=S.monthly.reduce((s,b)=>s+(b.debt||0),0);
  const aTotal=S.annual.reduce((s,b)=>s+b.amt,0);
  const aLeft=S.annual.filter(b=>!b.paid).reduce((s,b)=>s+b.amt,0);
  const iTotal=S.invest.reduce((s,b)=>s+b.amt,0);
  const cashTotal=S.cash.reduce((s,b)=>s+b.amt,0);
  const savingsTotal=S.cash.filter(b=>b.savings).reduce((s,b)=>s+b.amt,0);
  const minKeepTotal=S.cash.filter(b=>!b.savings).reduce((s,b)=>s+(b.minKeep||0),0);
  const spendCash=cashTotal-savingsTotal;
  const ccDebt=S.credit.reduce((s,b)=>s+b.debt,0);
  const ccLimit=S.credit.reduce((s,b)=>s+b.limit,0);
  const allVar=[...S.misc,...(S.health||[]),...(S.transport||[])];
  const miscBudget=allVar.reduce((s,m)=>s+m.budget,0);
  const miscSpent=allVar.reduce((s,m)=>s+m.spent,0);
  const miscLeft=Math.max(0,miscBudget-miscSpent);
  const paydayInfo=soonestPayday();
  const payday=paydayInfo?paydayInfo.date:null;
  const now=new Date(); now.setHours(0,0,0,0);
  const daysToPay=payday?Math.round((payday-now)/86400000):null;
  // The next calendar date a "due on day N" bill actually falls on, on/after today.
  const off=S.viewMonthOffset||0;
  // The month the bills currently represent.
  const cycleBase=new Date(now.getFullYear(),now.getMonth()+off,1);
  // Bills due on/before payday for the active cycle.
  // - An UNPAID bill counts at its due date in this cycle even if that date has already
  //   passed (it's overdue but still owed — it belongs in "due before payday").
  // - A PAID bill is done for this cycle, so its next occurrence is next month.
  const dueBefore=payday?S.monthly.filter(b=>b.due>0).map(b=>{
    let d=new Date(cycleBase.getFullYear(),cycleBase.getMonth(),b.due);
    if(b.paid) d=new Date(cycleBase.getFullYear(),cycleBase.getMonth()+1,b.due);
    return {bill:b,when:d};
  }).filter(x=>x.when<=payday).map(x=>x.bill):[];
  const dueBeforeTotal=dueBefore.reduce((s,b)=>s+eff(b),0);
  // per-job estimates — ranges (min=base/lowest rate, max=highest rate), OT excluded from budget
  const now2=new Date(); const yr=now2.getFullYear(), mo=now2.getMonth();
  const isOT=r=>/\bot\b|over ?time/i.test(r.name||"");
  const jobCalcs=S.jobs.filter(j=>!j.archived).map(j=>{
    const rates=(j.rates||[]);
    const budgetRates=rates.filter(r=>!isOT(r)&&(r.rate||0)>0);
    const per=FREQ[j.freq]?.per||26;
    const pct=(j.pct||0)/100;
    let grossMin,grossMax,hoursLabel,rateLabel;
    const weeksPerPeriod=({weekly:1,biweekly:2,semimonthly:52/24,monthly:52/12})[j.freq]||2;
    if(j.type==="ft"){
      const hrs=40*weeksPerPeriod;
      const rvals=budgetRates.map(r=>r.rate||0);
      const lo=rvals.length?Math.min(...rvals):0, hi=rvals.length?Math.max(...rvals):0;
      grossMin=lo*hrs; grossMax=hi*hrs;
      hoursLabel=(Math.round(hrs*100)/100).toString().replace(/\.00$/,"")+" hrs";
      rateLabel=rvals.length?(lo===hi?fmt(lo):fmt(lo)+"–"+fmt(hi)):"—";
    } else {
      // part time: use entered hours per rate (OT still excluded from budget)
      const g=budgetRates.reduce((s,r)=>s+(r.rate||0)*(r.hours||0),0);
      grossMin=g; grossMax=g;
      const hrs=budgetRates.reduce((s,r)=>s+(r.hours||0),0);
      hoursLabel=hrs.toFixed(2).replace(/\.00$/,"")+" hrs";
      rateLabel=budgetRates.map(r=>fmt(r.rate)).join(" / ")||"—";
    }
    const netMin=grossMin*(1-pct), netMax=grossMax*(1-pct);
    // if a schedule is filled out, it overrides the min/max range for this period
    let usingSchedule=false, schedGross=0, schedNet=0;
    if((j.schedule||[]).length){
      const opts={}; [...(j.rates||[]),...(j.labelRates||[])].forEach(r=>opts[r.name]=r.rate||0);
      schedGross=(j.schedule||[]).reduce((s,e)=>s+(opts[e.label]||0)*(e.hours||0),0);
      if(schedGross>0){ usingSchedule=true; schedNet=schedGross*(1-pct); }
    }
    const gMin=usingSchedule?schedGross:grossMin, gMax=usingSchedule?schedGross:grossMax;
    const nMin=usingSchedule?schedNet:netMin, nMax=usingSchedule?schedNet:netMax;
    const stubs=(j.stubs||[]).slice().sort((a,b)=>(a.payDate||"").localeCompare(b.payDate||""));
    const recent=stubs.length?stubs[stubs.length-1]:null;
    const ytdNet=recent?(recent.summary?.ytd?.net||recent.net||0):0;
    const ytdGross=recent?(recent.summary?.ytd?.gtw||recent.gross||0):0;
    const perMonth=per/12, perWeek=per/52;
    // paychecks with pay date in the current month (actual) and how many periods remain this month
    const paidThisMonth=stubs.filter(s=>{ if(!s.payDate) return false; const d=new Date(s.payDate+"T12:00"); return d.getFullYear()===yr&&d.getMonth()===mo; });
    // estimate remaining periods this month from pay frequency & next payday
    const daysInMonth=new Date(yr,mo+1,0).getDate();
    const periodDays=({weekly:7,biweekly:14,semimonthly:daysInMonth/2,monthly:daysInMonth})[j.freq]||14;
    let remainingPeriods=0;
    const pd=j.payAnchor?nextPaydayFreq(j.payAnchor,j.freq):nextPayday(S.payAnchor);
    if(pd){ let d=new Date(pd); while(d.getFullYear()===yr&&d.getMonth()===mo){ remainingPeriods++; d=new Date(d); d.setDate(d.getDate()+periodDays); } }
    else { const totalP=Math.round(per/12); remainingPeriods=Math.max(0,totalP-paidThisMonth.length); }
    const monthActualNet=paidThisMonth.reduce((s,st)=>s+(st.net||0),0);
    const monthActualGross=paidThisMonth.reduce((s,st)=>s+(st.gross||0),0);
    return {job:j,per,perMonth,perWeek,grossMin:gMin,grossMax:gMax,netMin:nMin,netMax:nMax,baseGrossMin:grossMin,baseGrossMax:grossMax,baseNetMin:netMin,baseNetMax:netMax,usingSchedule,hoursLabel,rateLabel,
      monthActualNet,monthActualGross,remainingPeriods,ytdNet,ytdGross,stubCount:stubs.length};
  });
  // fraction of the year still remaining (for year projection on top of YTD)
  const nowD=new Date();
  const yearStart=new Date(nowD.getFullYear(),0,1), yearEnd=new Date(nowD.getFullYear()+1,0,1);
  const yearFracLeft=(yearEnd-nowD)/(yearEnd-yearStart);
  const hasWeekly=jobCalcs.some(j=>j.job.freq==="weekly");
  const weekMin=jobCalcs.reduce((s,j)=>s+j.netMin*j.perWeek,0);
  const weekMax=jobCalcs.reduce((s,j)=>s+j.netMax*j.perWeek,0);
  // This month NET = actual paid this month + (remaining periods × per-check estimate range)
  const monthNetMin=jobCalcs.reduce((s,j)=>s+j.monthActualNet+j.netMin*j.remainingPeriods,0);
  const monthNetMax=jobCalcs.reduce((s,j)=>s+j.monthActualNet+j.netMax*j.remainingPeriods,0);
  const monthGrossMin=jobCalcs.reduce((s,j)=>s+j.monthActualGross+j.grossMin*j.remainingPeriods,0);
  const monthGrossMax=jobCalcs.reduce((s,j)=>s+j.monthActualGross+j.grossMax*j.remainingPeriods,0);
  const yearNetMin=jobCalcs.reduce((s,j)=>s+j.ytdNet+j.netMin*j.per*yearFracLeft,0);
  const yearNetMax=jobCalcs.reduce((s,j)=>s+j.ytdNet+j.netMax*j.per*yearFracLeft,0);
  const ytdGrossTot=jobCalcs.reduce((s,j)=>s+j.ytdGross,0);
  const ytdNetTot=jobCalcs.reduce((s,j)=>s+j.ytdNet,0);
  const loanDebt=S.monthly.filter(b=>(b.debt||0)>0&&!b.link).reduce((s,b)=>s+b.debt,0);
  // ----- "month settled?" — every bill paid AND the last paycheck of the month is in -----
  const allBillsPaid=S.monthly.length>0 && S.monthly.every(b=>b.paid);
  // is there any remaining payday still inside the current calendar month?
  let paydayLeftThisMonth=false;
  S.jobs.filter(j=>!j.archived&&j.payAnchor).forEach(j=>{
    const p=nextPaydayFreq(j.payAnchor,j.freq);
    if(p && p.getMonth()===now.getMonth() && p.getFullYear()===now.getFullYear()) paydayLeftThisMonth=true;
  });
  const monthSettled=allBillsPaid && !paydayLeftThisMonth && S.monthly.length>0;
  // If settled, "due this month" rolls forward to next month's full bill run.
  const nextMonthBills=S.monthly.filter(b=>!b.fromAnnual).reduce((s,b)=>s+eff(b),0)
    + S.annual.filter(b=>{ if(!b.date) return false; const d=new Date(b.date+"T12:00"); const nm=new Date(now.getFullYear(),now.getMonth()+1,1); return d.getFullYear()===nm.getFullYear()&&d.getMonth()===nm.getMonth(); }).reduce((s,b)=>s+b.amt,0);
  const dueThisMonth = monthSettled ? nextMonthBills : mLeft;
  const dueLabel = monthSettled ? "Coming next month" : "Total due this month";
  const totalDebt=ccDebt+loanDebt;
  // ----- yearly spending estimate -----
  const now3=new Date(); const curMonth=now3.getMonth(); // 0=Jan
  const billAmt=b=>payAmt(b)||0;
  // mirrored annual bills are skipped here — annualByMonth() already counts them
  const realMonthly=S.monthly.filter(b=>!b.fromAnnual);
  const monthlyBillsAll=realMonthly.reduce((s,b)=>s+billAmt(b),0);
  const monthlyBillsNoNewDebt=realMonthly.reduce((s,b)=>{ const isDebt=(b.debt||0)>0; if(isDebt&&!b.janStart) return s; return s+billAmt(b); },0);
  const monthlyVar=miscBudget; // misc+health+transport budgets
  const monthlyGoing=monthlyBillsAll+monthlyVar;   // this month onward
  const monthlyPast=monthlyBillsNoNewDebt+monthlyVar; // Jan..last month (drop debt bills not present in Jan)
  // annual bills, bucketed by the month they're due
  const annualByMonth=(mo)=>S.annual.reduce((s,b)=>{ if(!b.date) return s; const d=new Date(b.date+"T12:00"); return d.getMonth()===mo?s+(b.amt||0):s; },0);
  let ySpent=0, yRemain=0;
  for(let mo=0;mo<12;mo++){
    const base=(mo<curMonth)?monthlyPast:monthlyGoing;
    const withAnnual=base+annualByMonth(mo);
    if(mo<curMonth) ySpent+=withAnnual; else yRemain+=withAnnual;
  }
  const yearSpendEst=ySpent+yRemain;
  const netWorth=cashTotal+iTotal-totalDebt;
  const totalToSpend=spendCash-minKeepTotal;
  const afterBills=totalToSpend-dueBeforeTotal-miscLeft;
  return {eff,mTotal,mLeft,mDebt,aTotal,aLeft,iTotal,cashTotal,savingsTotal,minKeepTotal,spendCash,ccDebt,ccLimit,miscBudget,miscSpent,miscLeft,payday,paydayInfo,daysToPay,dueBefore,dueBeforeTotal,dueThisMonth,dueLabel,monthSettled,jobCalcs,hasWeekly,weekMin,weekMax,monthNetMin,monthNetMax,monthGrossMin,monthGrossMax,yearNetMin,yearNetMax,ytdGrossTot,ytdNetTot,totalDebt,netWorth,totalToSpend,afterBills,yearSpendEst,ySpent,yRemain,monthlyGoing,monthlyPast};
}

// ---------- notifications ----------
function collectAlerts(){
  const out=[];
  const st=S.settings;
  // Each account's own "minimum to keep" drives its alert. No minimum set = no alert.
  S.cash.filter(a=>Number(a.minKeep||0)>0&&a.amt<Number(a.minKeep)).forEach(a=>out.push({key:"low-"+a.id,title:"Account low",body:`${a.name} is at ${fmt(a.amt)} (below its ${fmt(a.minKeep)} minimum)`}));
  S.credit.filter(c=>c.limit>0&&(c.debt/c.limit)*100>=st.ccPct).forEach(c=>out.push({key:"cc-"+c.id,title:"Card usage high",body:`${c.name} is at ${((c.debt/c.limit)*100).toFixed(0)}% of its limit (${fmt(c.debt)} / ${fmtShort(c.limit)})`}));
  const now=new Date(); now.setHours(0,0,0,0);
  const vOff=S.viewMonthOffset||0;
  const cycleBase=new Date(now.getFullYear(),now.getMonth()+vOff,1);
  S.monthly.filter(b=>!b.paid&&b.due>0&&!b.fromAnnual).forEach(b=>{
    // this bill's date in the cycle currently being viewed
    const dd=new Date(cycleBase.getFullYear(),cycleBase.getMonth(),b.due);
    const diff=Math.round((dd-now)/86400000);
    if(diff>=0&&diff<=st.dueDays) out.push({key:"bill-"+b.id,title:"Bill due "+(diff===0?"today":"in "+diff+" day"+(diff>1?"s":"")),body:`${b.name} — ${fmt(payAmt(b))} due the ${ord(b.due)}`});
    // overdue only counts in the live current month; never while browsing a future cycle
    else if(vOff===0 && diff<0) out.push({key:"late-"+b.id,title:"Bill overdue",body:`${b.name} was due the ${ord(b.due)} — ${fmt(payAmt(b))}`});
  });
  S.annual.filter(b=>!b.paid&&b.date).forEach(b=>{
    const dd=new Date(b.date+"T12:00"); dd.setHours(0,0,0,0);
    const diff=Math.round((dd-now)/86400000);
    if(diff>=0&&diff<=st.dueDays) out.push({key:"ann-"+b.id,title:"Annual bill due "+(diff===0?"today":"in "+diff+" days"),body:`${b.name} — ${fmt(b.amt)}`});
  });
  if(st.overBudget!==false){
    const sections=[["Misc",S.misc],["Health",S.health||[]],["Transportation",S.transport||[]]];
    let totBud=0,totSpent=0;
    sections.forEach(([label,arr])=>{
      const bud=arr.reduce((s,m)=>s+m.budget,0), sp=arr.reduce((s,m)=>s+m.spent,0);
      totBud+=bud; totSpent+=sp;
      if(bud>0&&sp>bud) out.push({key:"ob-"+label,title:"Over budget",body:`${label} spending is over budget (${fmt(sp)} of ${fmt(bud)})`});
    });
    if(totBud>0&&totSpent>totBud) out.push({key:"ob-all",title:"Over budget",body:`Total variable spending is over budget (${fmt(totSpent)} of ${fmt(totBud)})`});
  }
  return out;
}
function buildSchedule(){
  // upcoming bill-due alerts for the next 35 days, for the native daily alarm
  const out=[]; const st=S.settings;
  const now=new Date(); now.setHours(0,0,0,0);
  const push=(dt,t,b)=>{ out.push({d:dt.toISOString().slice(0,10),t,b}); };
  for(let off=0;off<=35;off++){
    const day=new Date(now); day.setDate(day.getDate()+off);
    S.monthly.filter(x=>x.due>0&&!(off===0&&x.paid)).forEach(x=>{
      const dd=new Date(day.getFullYear(),day.getMonth(),x.due);
      const diff=Math.round((dd-day)/86400000);
      if(diff>=0&&diff<=st.dueDays&&dd.getMonth()===day.getMonth())
        push(day,"Bill due "+(diff===0?"today":"in "+diff+" day"+(diff>1?"s":"")),x.name+" — "+fmt(payAmt(x)));
    });
    S.annual.filter(x=>!x.paid&&x.date).forEach(x=>{
      const dd=new Date(x.date+"T12:00"); dd.setHours(0,0,0,0);
      const diff=Math.round((dd-day)/86400000);
      if(diff>=0&&diff<=st.dueDays)
        push(day,"Annual bill due "+(diff===0?"today":"in "+diff+" days"),x.name+" — "+fmt(x.amt));
    });
  }
  return out.slice(0,150);
}
function checkAlerts(){
  activeAlerts=collectAlerts();
  const native = typeof window!=="undefined" && window.Android;
  if(native){
    try{ window.Android.setSchedule(JSON.stringify(S.settings.notif?buildSchedule():[])); }catch(e){}
    if(S.settings.notif){
      const today=dayKey();
      activeAlerts.forEach(a=>{
        if(S.notified[a.key]!==today){
          try{ window.Android.notify(a.title,a.body); }catch(e){}
          S.notified[a.key]=today;
        }
      });
      persist();
    }
    return;
  }
  if(S.settings.notif && typeof Notification!=="undefined" && Notification.permission==="granted"){
    const today=dayKey();
    activeAlerts.forEach(a=>{
      if(S.notified[a.key]!==today){
        try{ new Notification(a.title,{body:a.body,tag:a.key}); }catch(e){}
        S.notified[a.key]=today;
      }
    });
    persist();
  }
}
function toggleNotif(on){
  if(typeof window!=="undefined" && window.Android){
    S.settings.notif=!!on;
    banner = on ? "Notifications on — bills are checked daily at 9 AM even when the app is closed. If nothing shows, allow notifications for Ledger in Android settings." : "Notifications off";
    persist(); checkAlerts(); render(); return;
  }
  if(on){
    if(typeof Notification==="undefined"){ banner="Notifications aren't supported in this browser/WebView"; render(); return; }
    Notification.requestPermission().then(p=>{
      S.settings.notif = p==="granted";
      banner = p==="granted" ? "Notifications on — alerts fire when the app checks (on open + every 30 min while open)" : "Permission denied — enable notifications for this app in Android settings";
      persist(); checkAlerts(); render();
    });
  } else { S.settings.notif=false; persist(); render(); }
}

const ST_BLANK={
  earnings:{name:"",jobTitle:"",hours:0,rate:0,cur:0,ytd:0},
  deductions:{name:"",pretax:"",eeCur:0,eeYtd:0,erCur:0,erYtd:0,_pEE:0,_pER:0},
  taxes:{name:"",cur:0,ytd:0,_p:0},
  pto:{plan:"",taken:0,cur:0,bal:0},
};
function stAdd(sec){ F[sec].push({...ST_BLANK[sec]}); renderSheet(); }
function stDel(sec,i){ F[sec].splice(i,1); renderSheet(); }

function stGross(){ return F.earnings.reduce((s,e)=>s+(e.cur||0),0); }
function stAutofill(){
  const g=stGross();
  F.deductions.forEach(d=>{
    if(!d._eeMan) d.eeCur=r2(g*(d._pEE||0));
    if(!d._erMan) d.erCur=r2(g*(d._pER||0));
  });
  F.taxes.forEach(t=>{ if(!t._man) t.cur=r2(g*(t._p||0)); });
  stAutofillYtd();
}
function stSet(sec,i,k,v){
  const row=F[sec][i];
  if(k==="name"||k==="jobTitle"||k==="pretax"||k==="plan") row[k]=v;
  else row[k]=parseFloat(v)||0;
  if(sec==="earnings"){
    if(k==="hours"||k==="rate"){ if(!row._curMan) row.cur=r2((row.hours||0)*(row.rate||0)); }
    if(k==="cur") row._curMan=true;
    // YTD auto = prior stub's YTD + this current, unless the user typed YTD directly
    if((k==="hours"||k==="rate"||k==="cur")&&!row._ytdMan) row.ytd=r2((row._pYtd||0)+(row.cur||0));
    if(k==="ytd") row._ytdMan=true;
    stAutofill();
    F.deductions.forEach((d,di)=>{ const a=document.getElementById(`sd_ee_${di}`); if(a&&!d._eeMan) a.value=d.eeCur; const b=document.getElementById(`sd_er_${di}`); if(b&&!d._erMan) b.value=d.erCur; const y=document.getElementById(`sd_eey_${di}`); if(y&&!d._eeyMan) y.value=d.eeYtd; });
    F.taxes.forEach((t,ti)=>{ const a=document.getElementById(`st_cur_${ti}`); if(a&&!t._man) a.value=t.cur; const y=document.getElementById(`st_ytd_${ti}`); if(y&&!t._ytdMan) y.value=t.ytd; });
    const c=document.getElementById(`se_cur_${i}`); if(c&&!row._curMan) c.value=row.cur;
    const yy=document.getElementById(`se_ytd_${i}`); if(yy&&!row._ytdMan) yy.value=row.ytd;
  }
  if(sec==="deductions"){
    if(k==="eeCur") row._eeMan=true;
    if(k==="erCur") row._erMan=true;
    if(k==="eeYtd") row._eeyMan=true;
    // auto EE YTD = prior + current
    if((k==="eeCur")&&!row._eeyMan) row.eeYtd=r2((row._pYtdEE||0)+(row.eeCur||0));
    const y=document.getElementById(`sd_eey_${i}`); if(y&&!row._eeyMan) y.value=row.eeYtd;
  }
  if(sec==="taxes"){
    if(k==="cur") row._man=true;
    if(k==="ytd") row._ytdMan=true;
    if((k==="cur")&&!row._ytdMan) row.ytd=r2((row._pYtd||0)+(row.cur||0));
    const y=document.getElementById(`st_ytd_${i}`); if(y&&!row._ytdMan) y.value=row.ytd;
  }
  stTotals();
}
function stAutofillYtd(){
  // called after autofill sets eeCur/cur from percentages, to keep YTD in step
  F.deductions.forEach(d=>{ if(!d._eeyMan) d.eeYtd=r2((d._pYtdEE||0)+(d.eeCur||0)); });
  F.taxes.forEach(t=>{ if(!t._ytdMan) t.ytd=r2((t._pYtd||0)+(t.cur||0)); });
}
function stSum(){
  const g=stGross();
  const hrs=F.earnings.reduce((s,e)=>s+(e.hours||0),0);
  const pretaxEE=F.deductions.filter(d=>d.pretax==="yes").reduce((s,d)=>s+(d.eeCur||0),0);
  const pretaxEEy=F.deductions.filter(d=>d.pretax==="yes").reduce((s,d)=>s+(d.eeYtd||0),0);
  const eeDed=F.deductions.reduce((s,d)=>s+(d.eeCur||0),0);
  const eeDedY=F.deductions.reduce((s,d)=>s+(d.eeYtd||0),0);
  const erDed=F.deductions.reduce((s,d)=>s+(d.erCur||0),0);
  const erDedY=F.deductions.reduce((s,d)=>s+(d.erYtd||0),0);
  const tax=F.taxes.reduce((s,t)=>s+(t.cur||0),0);
  const taxY=F.taxes.reduce((s,t)=>s+(t.ytd||0),0);
  const gY=F.earnings.reduce((s,e)=>s+(e.ytd||0),0);
  const o=F.ovr;
  const cur={gtw:o.c_gtw??r2(g-pretaxEE),tax:o.c_tax??r2(tax),ded:o.c_ded??r2(eeDed),net:o.c_net??r2(g-tax-eeDed)};
  const ytd={gtw:o.y_gtw??r2(gY-pretaxEEy),tax:o.y_tax??r2(taxY),ded:o.y_ded??r2(eeDedY),net:o.y_net??r2(gY-taxY-eeDedY)};
  return {g,gY,hrs,eeDed,eeDedY,erDed,erDedY,tax,taxY,cur,ytd};
}
function stOvr(k,v){ if(v===""||v==null) delete F.ovr[k]; else F.ovr[k]=parseFloat(v)||0; stTotals(); }
function stTotals(){
  const el=document.getElementById("stubTotals");
  if(el) el.innerHTML=stubTotalsHTML();
}
function stubTotalsHTML(){
  const s=stSum();
  const sumIn=(k,val)=>`<input type="number" step="0.01" inputmode="decimal" value="${val}" style="width:90px;text-align:right;padding:4px 6px;font-size:12px" oninput="stOvr('${k}',this.value)">`;
  return `
    ${krow("Total hours",s.hrs.toFixed(2))}
    ${krow("Gross pay",fmt(s.g),"g",true,true)}
    ${krow("Employee deductions ("+(s.g?((s.eeDed/s.g)*100).toFixed(1):"0")+"% of gross)","−"+fmt(s.eeDed),"r")}
    ${krow("Employer deductions",fmt(s.erDed),"b")}
    ${krow("Taxes ("+(s.g?((s.tax/s.g)*100).toFixed(1):"0")+"% of gross)","−"+fmt(s.tax),"r")}
    <div class="sec" style="margin-top:12px">Plan summary <span style="text-transform:none;letter-spacing:0">(auto — edit any box to override)</span></div>
    <div style="display:grid;grid-template-columns:60px 1fr 1fr 1fr 1fr;gap:6px;align-items:center;font-size:11px">
      <span></span><span class="d">Gross taxable</span><span class="d">Taxes</span><span class="d">Deductions</span><span class="d">Net pay</span>
      <span class="d">Current</span>${sumIn("c_gtw",s.cur.gtw)}${sumIn("c_tax",s.cur.tax)}${sumIn("c_ded",s.cur.ded)}${sumIn("c_net",s.cur.net)}
      <span class="d">YTD</span>${sumIn("y_gtw",s.ytd.gtw)}${sumIn("y_tax",s.ytd.tax)}${sumIn("y_ded",s.ytd.ded)}${sumIn("y_net",s.ytd.net)}
    </div>`;
}

function saveStub(){
  const j=S.jobs.find(x=>x.id===editing.jobId);
  const s=stSum();
  if(!(s.g>0)){ alert("Enter at least one earning with a current amount."); return; }
  const clean=o=>{const c={...o};Object.keys(c).forEach(k=>{if(k.startsWith("_"))delete c[k];});return c;};
  const stub={
    id:Date.now(),start:F.start,end:F.end,payDate:F.payDate,
    earnings:F.earnings.filter(e=>e.name).map(clean),
    deductions:F.deductions.filter(d=>d.name).map(clean),
    taxes:F.taxes.filter(t=>t.name).map(clean),
    pto:F.pto.filter(p=>p.plan).map(clean),
    summary:{cur:s.cur,ytd:s.ytd},hours:s.hrs,
    gross:s.g,net:s.cur.net, // used by estimates
    pct:s.g?r2(((s.g-s.cur.net)/s.g)*100):0,
  };
  j.stubs=[stub,...(j.stubs||[])];
  // learn saved options + percentages for future autofill (saved list = exactly this stub's rows)
  j.earningTypes=stub.earnings.map(e=>({name:e.name,jobTitle:e.jobTitle,rate:e.rate}));
  j.dedTypes=stub.deductions.map(d=>({name:d.name,pretax:d.pretax,pctEE:s.g?d.eeCur/s.g:0,pctER:s.g?d.erCur/s.g:0}));
  j.taxTypes=stub.taxes.map(t=>({name:t.name,pct:s.g?t.cur/s.g:0}));
  j.ptoPlans=stub.pto.map(p=>p.plan);
  j.pct=stub.pct; // net-estimate rate for the job card
  addLog({name:j.name+" paystub",action:"added",delta:stub.net});
  persist(); closeSheet(); render();
}
function delStub(jid,sid){
  if(!confirm("Delete this stub from history?")) return;
  S.jobs=S.jobs.map(j=>j.id!==jid?j:{...j,stubs:j.stubs.filter(s=>s.id!==sid)});
  persist(); openHistory(jid);
}

      ${items}

// backup / restore
// The profile photo is a big base64 blob and isn't financial data — excluding it keeps
// backups small enough to copy reliably (Android clipboard truncates very large text).
function backupString(includePhoto){
  if(includePhoto) return JSON.stringify(S);
  const clone={...S};
  if(clone.profile&&clone.profile.photo){ clone.profile={...clone.profile,photo:""}; }
  return JSON.stringify(clone);
}
function doBackup(){ const ta=document.getElementById("bk"); ta.value=backupString(false); backupStatus="✓ Backup generated below (photo excluded to keep it small)"; render(true); }
function doCopy(){
  const ta=document.getElementById("bk");
  if(!ta.value) ta.value=backupString(false);
  const txt=ta.value;
  const done=o=>{ backupStatus=o?"✓ Copied to clipboard":"Couldn't auto-copy — long-press the box to copy manually"; render(true); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>done(true)).catch(()=>{ ta.select(); done(document.execCommand("copy")); }); }
  else { ta.select(); done(document.execCommand("copy")); }
}
// Save straight to a file through the Android bridge — no clipboard, no size cap.
function doSaveFile(){
  const txt=backupString(true); // file can hold the photo fine
  const stamp=new Date().toISOString().slice(0,10);
  const name="ledger-backup-"+stamp+".json";
  try{
    if(window.Android&&window.Android.saveBackup){
      window.Android.saveBackup(name,txt);
      backupStatus="Opening file picker — choose where to save "+name;
    } else {
      // browser fallback: trigger a download
      const blob=new Blob([txt],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
      backupStatus="✓ Downloaded "+name;
    }
  }catch(e){ backupStatus="✗ Couldn't save file — use Copy instead"; }
  render(true);
}
// Called from native code after a file save completes.
window.ledgerBackupStatus=function(msg){ backupStatus=msg; try{render(true);}catch(e){} };
function doRestore(){
  const ta=document.getElementById("bk");
  try{
    const p=JSON.parse(ta.value.trim());
    if(!p.monthly||!p.cash) throw 0;
    // preserve current photo if the restored backup omitted it
    if(p.profile&&!p.profile.photo&&S.profile&&S.profile.photo) p.profile.photo=S.profile.photo;
    S=migrate(p); persist(); backupStatus="✓ Data restored"; ta.value=""; render();
  }catch(e){ backupStatus="✗ Invalid backup — paste the exact text from a previous Backup"; render(true); }
}

const TITLES={monthly:"Monthly bill",annual:"Annual bill",invest:"Investment",cash:"Bank account",credit:"Credit card",misc:"Misc category",health:"Health category",transport:"Transportation category",stub:"Paystub"};
const ADJ={misc:["spent","spent"],health:["spent","spent"],transport:["spent","spent"],cash:["amt","balance"],invest:["amt","balance"],credit:["debt","debt"],monthly:["debt","debt"]};

function openEdit(t,id){
  const item=id!=null?S[t].find(x=>x.id===id):null;
  editing={tab:t,item};
  F=item?JSON.parse(JSON.stringify(item)):JSON.parse(JSON.stringify(BLANK[t]));
  renderSheet();
}
function closeSheet(){ editing=null; F=null; document.getElementById("sheetHost").innerHTML=""; }
// Guarded close: warns before discarding an in-progress paystub that has data.
function tryCloseSheet(){
  if(editing&&editing.tab==="stub"&&F){
    const hasData=(F.start||F.end||F.payDate) ||
      (F.earnings||[]).some(e=>(e.cur||0)>0||(e.hours||0)>0||(e.ytd||0)>0) ||
      (F.deductions||[]).some(d=>(d.eeCur||0)>0||(d.eeYtd||0)>0) ||
      (F.taxes||[]).some(t=>(t.cur||0)>0);
    if(hasData && !confirm("You haven't saved this paystub. Discard it and close?")) return;
  }
  closeSheet();
}
function fSet(k,v){ F[k]=v; }
function fSetNum(k,v){ F[k]=parseFloat(v)||0; }
function fSetBool(k,v){ F[k]=!!v; }
function applyAdj(sign){
  const [field]=ADJ[editing.tab]||[];
  const inp=document.getElementById("adjIn");
  const v=parseFloat(inp.value);
  if(!v) return;
  F[field]=Math.round((Number(F[field]||0)+sign*v)*100)/100;
  inp.value="";
  document.getElementById("adjCur").textContent="currently "+fmt(F[field]);
  const main=document.getElementById("f_"+field);
  if(main) main.value=F[field];
}
function saveSheet(){
  if(editing.tab==="stub"){ saveStub(); return; }
  checkpoint();
  const key=editing.tab;
  if(F.name!=null) F.name=titleCase(F.name);
  if(F.tag!=null&&F.tag!=="") F.tag=titleCase(F.tag);
  if(editing.item){
    S[key]=S[key].map(x=>x.id===F.id?F:x);
    const vf=(ADJ[key]||[])[0];
    if(vf){
      const before=Number(editing.item[vf]||0),after=Number(F[vf]||0);
      if(Math.abs(after-before)>0.001) addLog({name:F.name,action:vf,delta:after-before,cat:key});
    }
  } else { F.id=Date.now(); S[key].push(F); addLog({name:F.name,action:"added",delta:0,cat:key}); }
  if(F.link&&VALUE_FIELD[key]) propagateLink(F.link,F[VALUE_FIELD[key]]);
  // keep APR consistent across linked records
  if(F.link){
    if(Number(F.apr||0)>0){
      // push our APR to partners that don't have one
      ["monthly","credit"].forEach(k=>{ S[k]=(S[k]||[]).map(x=>(x.link===F.link&&x.id!==F.id&&!(Number(x.apr||0)>0))?{...x,apr:Number(F.apr)}:x); });
    } else {
      // we don't have an APR — pull one from a partner that does
      let found=0;
      ["credit","monthly"].forEach(k=>{ (S[k]||[]).forEach(x=>{ if(x.link===F.link&&x.id!==F.id&&Number(x.apr||0)>0&&!found) found=Number(x.apr); }); });
      if(found){ S[key]=S[key].map(x=>x.id===F.id?{...x,apr:found}:x); }
    }
  }
  persist(); checkAlerts();
  if((key==="misc"||key==="health"||key==="transport")&&F.budget>0&&F.spent>F.budget){
    render();
    if(maybeOfferCompensate(F)) return;
  }
  closeSheet(); render();
}
function delSheet(){
  checkpoint();
  S[editing.tab]=S[editing.tab].filter(x=>x.id!==editing.item.id);
  addLog({name:editing.item.name,action:"deleted",delta:0});
  persist(); closeSheet(); render();
}

//SCAN-PARSERS-START
function scanNum(tok){
  let t=String(tok||"").trim(); if(!t) return null;
  let neg=false;
  if(t.startsWith("(")&&t.endsWith(")")){ neg=true; t=t.slice(1,-1); }
  t=t.split("$").join("").split(",").join("").trim();
  if(t.endsWith("-")){ neg=true; t=t.slice(0,-1); }
  if(t.startsWith("-")){ neg=true; t=t.slice(1); }
  if(!/^\d+(\.\d+)?$/.test(t)) return null;
  const v=parseFloat(t); return neg?-v:v;
}
// group OCR line boxes into visual rows (left→right), so table rows come back as one string
function scanRows(lines){
  lines=(lines||[]).filter(l=>l&&String(l.t||"").trim());
  if(!lines.length) return [];
  if(lines.some(l=>l.y0==null)) return lines.map(l=>String(l.t).trim());
  const hs=lines.map(l=>Math.max(1,l.y1-l.y0)).sort((a,b)=>a-b);
  const mh=hs[Math.floor(hs.length/2)];
  const L=lines.map(l=>({...l,cy:(l.y0+l.y1)/2})).sort((a,b)=>a.cy-b.cy);
  const rows=[];
  L.forEach(l=>{
    const r=rows[rows.length-1];
    if(r&&Math.abs(l.cy-r.cy)<mh*0.6){ r.items.push(l); r.cy=r.items.reduce((s,x)=>s+x.cy,0)/r.items.length; }
    else rows.push({cy:l.cy,items:[l]});
  });
  return rows.map(r=>{
    r.items.sort((a,b)=>a.x0-b.x0);
    let s="";
    r.items.forEach((it,i)=>{
      if(i>0){ const gap=it.x0-r.items[i-1].x1; s+=gap>mh*0.5?"  ":" "; }
      s+=String(it.t).trim();
    });
    return s;
  });
}
// split "Regular Pay  17.64  60.00  1,058.40" into name + trailing numbers
function scanSplit(row){
  let toks=String(row).trim().split(/\s+/).filter(Boolean);
  // glued "Tax82.10" → "Tax" "82.10"
  if(toks.length){
    const last=toks[toks.length-1], m=/^(.*[A-Za-z])(\d+\.\d\d)$/.exec(last);
    if(m) toks.splice(toks.length-1,1,m[1],m[2]);
  }
  const nums=[], raw=[];
  let i=toks.length;
  while(i>0){
    const v=scanNum(toks[i-1]);
    if(v===null) break;
    nums.unshift(v); raw.unshift(toks[i-1]); i--;
  }
  const name=toks.slice(0,i).join(" ").replace(/[:|]+$/,"").trim();
  return {name,nums,raw,money:raw.some(r=>r.includes("."))};
}
function scanDateIso(m,d,y){
  m=+m; d=+d; y=+y; if(y<100) y+=2000;
  if(!(m>=1&&m<=12&&d>=1&&d<=31&&y>=2000&&y<=2100)) return "";
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
const SCAN_MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function scanDates(text){
  const out=[]; let m;
  const re=/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})\b/g;
  while((m=re.exec(text))){ const d=scanDateIso(m[1],m[2],m[3]); if(d) out.push({i:m.index,d}); }
  const re2=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/gi;
  while((m=re2.exec(text))){ const d=scanDateIso(SCAN_MONTHS[m[1].toLowerCase()],m[2],m[3]); if(d) out.push({i:m.index,d}); }
  return out.sort((a,b)=>a.i-b.i);
}
const SCAN_TAXW=/tax|medicare|social security|fica|fed\b|federal|oasdi|\bsdi\b|futa|suta|withhold|\bsit\b|\bfit\b/i;
const SCAN_DEDW=/401|403|roth|dental|vision|medical|health|insurance|\bfsa\b|\bhsa\b|\bltd\b|\bstd\b|life|garnish|union|dues|retire|pension|parking|transit|supplemental|voluntary|accident|critical|legal/i;
const SCAN_EARNW=/pay\b|wage|salary|regular|overtime|\bot\b|bonus|commission|shift|holiday|pto|vacation|sick|differential|tips|stipend|hourly/i;

function scanColsFromHeader(lower){
  const defs=[["rate",/\brate\b/],["hours",/\bhours?\b|\bhrs\b|\bunits\b/],["cur",/current|this period|this check|amount|\bpay\b/],["ytd",/\bytd\b|year to date|year-to-date/]];
  const found=[];
  defs.forEach(([k,re])=>{ const m=re.exec(lower); if(m) found.push({k,i:m.index}); });
  found.sort((a,b)=>a.i-b.i);
  return found.length>=2&&found.some(f=>f.k==="ytd")?found.map(f=>f.k):null;
}
function parseStub(rows){
  const out={start:"",end:"",payDate:"",earnings:[],deductions:[],taxes:[],pto:[],totals:{},seen:{}};
  let sec=null, cols=null, pretax="";
  const lbl=[["payDate",/pay date|check date|date paid|payment date|pay day/g],["start",/period begin\w*|period start\w*|pay period start|beginning date|from date/g],["end",/period end\w*|pay period end|ending date|through date/g]];
  rows.forEach(row=>{
    const lower=row.toLowerCase();
    // ---- dates ----
    const hits=[];
    lbl.forEach(([k,re])=>{ re.lastIndex=0; let m; while((m=re.exec(lower))) hits.push({k,i:m.index}); });
    if(hits.length){
      hits.sort((a,b)=>a.i-b.i);
      const ds=scanDates(row);
      hits.forEach((h,n)=>{
        const nextI=n+1<hits.length?hits[n+1].i:1e9;
        const d=ds.find(x=>x.i>=h.i&&x.i<nextI);
        if(d&&!out[h.k]) out[h.k]=d.d;
      });
    } else if(/pay period|period:/.test(lower)){
      const ds=scanDates(row);
      if(ds.length>=2){ if(!out.start) out.start=ds[0].d; if(!out.end) out.end=ds[1].d; }
    }
    const sp=scanSplit(row);
    const name=sp.name, nl=name.toLowerCase();
    // ---- printed totals ----
    if(/^(total\s+)?(gross|earnings)(\s+(pay|earnings|wages))?$|^total\s+(gross|earnings)/.test(nl)&&sp.nums.length){ out.totals.gross=sp.nums; return; }
    if(/^(net\s+(pay|check)|take\s*home)/.test(nl)&&sp.nums.length){ out.totals.net=sp.nums; return; }
    if(/^total\s+(employee\s+)?deductions?/.test(nl)&&sp.nums.length){ out.totals.ded=sp.nums; return; }
    if(/^total\s+(employee\s+)?tax/.test(nl)&&sp.nums.length){ out.totals.tax=sp.nums; return; }
    // ---- section headers ----
    const hdr=(re)=>re.test(lower);
    let newSec=null;
    if(/^(earnings|earning|pay description|description of earnings)\b/.test(lower)) newSec="earnings";
    else if(/^(pre[\s-]?tax|post[\s-]?tax|employee|voluntary|other)?\s*deductions?\b/.test(lower)||/^(pre|post)[\s-]?tax\s+(deductions?|benefits)/.test(lower)) newSec="deductions";
    else if(/^(taxes|tax(es)? withheld|withholdings?|tax description|statutory)\b/.test(lower)) newSec="taxes";
    else if(/^(time off|paid time off|pto|leave|accruals?|vacation\/sick)\b/.test(lower)&&!sp.money) newSec="pto";
    if(newSec&&(sp.nums.length===0||!sp.money||/\bytd\b|current|hours|rate/.test(lower))){
      sec=newSec; out.seen[sec]=true; cols=scanColsFromHeader(lower);
      pretax=newSec==="deductions"?(/pre[\s-]?tax/.test(lower)?"yes":/post[\s-]?tax/.test(lower)?"no":""):"";
      return;
    }
    if(!name&&!sp.nums.length) return;
    if(sp.nums.length===0){
      // possible column header row under a section title
      const c=scanColsFromHeader(lower); if(c){ cols=c; return; }
      return;
    }
    if(!sp.money) return; // money amounts always carry cents; this filters addresses, IDs, SSN fragments
    // ---- data rows ----
    let kind=sec;
    if(!kind){
      if(SCAN_TAXW.test(name)) kind="taxes"; else if(SCAN_DEDW.test(name)) kind="deductions"; else if(SCAN_EARNW.test(name)) kind="earnings";
    }
    if(!kind||!name) return;
    // a stray leading integer belongs to the name ("Shift 2 28.444 4.00 113.78 900.20")
    let nameF=name;
    while(sp.nums.length>(kind==="earnings"?4:2)&&sp.raw.length&&!sp.raw[0].includes(".")&&sp.raw[0].length<=2){ nameF+=" "+sp.raw[0]; sp.nums.shift(); sp.raw.shift(); }
    const n=sp.nums;
    if(kind==="earnings"){
      const e={name:nameF,hours:0,rate:0,cur:0,ytd:null,pair:null};
      if(cols&&cols.length===n.length){
        cols.forEach((k,i)=>{ if(k==="rate")e.rate=n[i]; else if(k==="hours")e.hours=n[i]; else if(k==="cur")e.cur=n[i]; else if(k==="ytd")e.ytd=n[i]; });
      } else if(n.length>=4){
        const [a,b,c,y]=n.slice(-4); e.cur=c; e.ytd=y;
        if(Math.abs(a*b-c)<=Math.max(0.05,c*0.002)){ e.pair=[a,b]; }
        e.rate=a; e.hours=b;
      } else if(n.length===3){
        const [x,c,y]=n; e.cur=c; e.ytd=y;
        const q=x?c/x:0;
        if(q>0&&Math.abs(q*x-c)<0.01){ e.pair=[x,Math.round(q*10000)/10000]; e.rate=Math.min(x,q); e.hours=Math.max(x,q); }
      } else if(n.length===2){ e.cur=n[0]; e.ytd=n[1]; }
      else e.cur=n[0];
      if(e.pair){ // 3+ decimals = a rate (28.444); otherwise the smaller figure is usually the rate. A saved rate overrides this later.
        const [p,q]=e.pair, dec=v=>((String(v).split(".")[1])||"").length;
        if(dec(p)>2&&dec(q)<=2){ e.rate=p; e.hours=q; }
        else if(dec(q)>2&&dec(p)<=2){ e.rate=q; e.hours=p; }
        else { e.rate=Math.min(p,q); e.hours=Math.max(p,q); }
      }
      if(e.cur<0) e.cur=Math.abs(e.cur);
      out.earnings.push(e);
    } else if(kind==="deductions"){
      const isEr=/employer|\ber\b|\(er\)|match/.test(nl);
      const base=name.replace(/employer|\(er\)|\bER\b/gi,"").replace(/\s+/g," ").trim()||name;
      const cur=Math.abs(n[0]), ytd=n.length>=2?Math.abs(n[1]):null;
      if(isEr){
        const hit=out.deductions.find(d=>d.name.toLowerCase()===base.toLowerCase());
        if(hit){ hit.erCur=cur; hit.erYtd=ytd; }
        else out.deductions.push({name:base,pretax,eeCur:0,eeYtd:null,erCur:cur,erYtd:ytd});
      } else out.deductions.push({name:nameF,pretax,eeCur:cur,eeYtd:ytd,erCur:null,erYtd:null});
    } else if(kind==="taxes"){
      out.taxes.push({name:nameF,cur:Math.abs(n[0]),ytd:n.length>=2?Math.abs(n[1]):null});
    } else if(kind==="pto"){
      const p={plan:nameF,taken:0,cur:0,bal:0};
      if(n.length>=3){ p.taken=n[0]; p.cur=n[1]; p.bal=n[2]; } else if(n.length===2){ p.cur=n[0]; p.bal=n[1]; } else p.bal=n[0];
      out.pto.push(p);
    }
  });
  return out;
}

const SCAN_SKIP_MERCH=/^(welcome|thank|thanks|receipt|invoice|store\s*#|tel|phone|www\.|http|cashier|order|date|time|sale|transaction|customer copy|merchant copy)/i;
function scanTitleCase(s){
  if(s!==s.toUpperCase()) return s;
  return s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
}
function parseReceipt(rows){
  const out={merchant:"",total:null,totalGuess:false,tax:null,date:"",card:""};
  // merchant: first clean-looking text row near the top
  for(let i=0;i<Math.min(rows.length,10);i++){
    const r=rows[i].trim(), letters=(r.match(/[A-Za-z]/g)||[]).length;
    if(letters<3) continue;
    if(letters<r.replace(/\s/g,"").length*0.5) continue;
    if(SCAN_SKIP_MERCH.test(r)) continue;
    if(/^\d/.test(r)) continue;                         // street addresses
    if(/\b(st|ave|blvd|rd|road|street|suite|hwy)\b\.?\s*,?\s*\d*$/i.test(r)&&/\d/.test(r)) continue;
    out.merchant=scanTitleCase(r.replace(/[*#]+/g,"").replace(/\s+/g," ").trim());
    break;
  }
  // total: prefer "total", then "amount/balance due", then loose "amount"
  const lastNum=(i)=>{
    const sp=scanSplit(rows[i]);
    if(sp.nums.length&&sp.money) return sp.nums[sp.nums.length-1];
    if(i+1<rows.length){ const s2=scanSplit(rows[i+1]); if(!s2.name&&s2.nums.length&&s2.money) return s2.nums[s2.nums.length-1]; }
    return null;
  };
  const bad=/sub\s*-?\s*total|savings|discount|items?\b|change|tender|points|rewards|cash\b|you saved|tax/i;
  let best=null;
  rows.forEach((r,i)=>{
    const l=r.toLowerCase(); let pr=0;
    if(/\btotal\b/.test(l)&&!bad.test(l)) pr=3;
    else if(/amount due|balance due|total due|amount paid|grand total/.test(l)&&!/change/.test(l)) pr=2;
    else if(/^(amount|sale amt|sale amount|purchase)\b/.test(l)) pr=1;
    if(!pr) return;
    const v=lastNum(i); if(v==null||!(v>0)) return;
    if(!best||pr>best.pr||(pr===best.pr)) best={pr,v};
  });
  if(best) out.total=Math.round(best.v*100)/100;
  else{
    let mx=0; rows.forEach(r=>{ const sp=scanSplit(r); if(sp.money&&!/change|cash|tender/i.test(r)) sp.nums.forEach(v=>{ if(v>mx&&v<100000) mx=v; }); });
    if(mx>0){ out.total=Math.round(mx*100)/100; out.totalGuess=true; }
  }
  rows.forEach((r,i)=>{ if(out.tax==null&&/\btax\b/i.test(r)&&!/total|before|taxable/i.test(r)){ const v=lastNum(i); if(v!=null&&v>=0) out.tax=v; } });
  for(const r of rows){ const d=scanDates(r); if(d.length){ out.date=d[0].d; break; } }
  const alltxt=rows.join("\n");
  let m=/(visa|mastercard|master card|mc|amex|american express|discover|debit|credit)\b[^0-9\n]{0,12}[x*•.\s]*(\d{4})\b/i.exec(alltxt)
     ||/(?:ending in|ending|acct|account|card)\s*[#:]?\s*(?:[x*•.]{2,}\s*)?(\d{4})\b/i.exec(alltxt)
     ||/[x*•]{3,}\s*(\d{4})\b/i.exec(alltxt);
  if(m) out.card=(m[2]||m[1]);
  return out;
}

  if(inSheet&&editing&&editing.tab==="stub"&&F) renderSheet(); else closeSheet();
}

// ---- paystub: fill the stub sheet, then the user reviews/edits it as normal ----
function scanApplyStub(rows){
  const p=parseStub(rows);
  const found=p.earnings.length+p.deductions.length+p.taxes.length;
  if(!found){
    const raw=rows.map(esc).join("\n");
    document.getElementById("sheetHost").innerHTML=`
      <div class="overlay center" onclick="if(event.target===this)scanBack()"><div class="sheet centered">
        <h3>Couldn't find paystub rows</h3>
        <div class="hint">The text was read but no earnings / deductions / taxes lines were recognised. Retake with the whole stub in frame, or enter it by hand.</div>
        <details style="margin-top:8px"><summary class="hint">Show what was read</summary><pre style="white-space:pre-wrap;font-size:11px;color:var(--dim)">${raw}</pre></details>
        <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" style="width:auto" onclick="scanBack()">OK</button></div>
      </div></div>`;
    return;
  }
  const jid=scanCtx.jid, inSheet=scanCtx.inSheet;
  if(!(inSheet&&editing&&editing.tab==="stub"&&F)) openStub(jid);
  const j=S.jobs.find(x=>x.id===jid);
  const used=new Set(), unmatched=[];
  const take=(arr,key,name)=>{
    const n=scanNorm(name);
    let r=arr.find(x=>!used.has(x)&&scanNorm(x[key])===n);
    if(!r) r=arr.find(x=>!used.has(x)&&scanNorm(x[key])&&n&&(scanNorm(x[key]).startsWith(n)||n.startsWith(scanNorm(x[key]))));
    if(r) used.add(r);
    return r||null;
  };
  if(p.start) F.start=p.start; if(p.end) F.end=p.end; if(p.payDate) F.payDate=p.payDate;
  if(p.earnings.length){
    p.earnings.forEach(e=>{
      let row=take(F.earnings,"name",e.name);
      if(!row){ row={...ST_BLANK.earnings,name:e.name,jobTitle:j.title||"",_pYtd:0}; F.earnings.push(row); used.add(row); }
      let {hours,rate}=e;
      if(e.pair&&row.rate>0){ // the saved rate decides which figure is the rate
        const [a,b]=e.pair;
        if(Math.abs(a-row.rate)<0.0006){ rate=a; hours=b; } else if(Math.abs(b-row.rate)<0.0006){ rate=b; hours=a; }
      }
      row.hours=hours||0; row.rate=rate||0; row.cur=e.cur; row._curMan=true;
      if(e.ytd!=null){ row.ytd=e.ytd; row._ytdMan=true; } else { row.ytd=r2((row._pYtd||0)+row.cur); row._ytdMan=false; }
    });
    F.earnings.forEach(x=>{ if(!used.has(x)){ unmatched.push(x.name||"(earning)"); x.hours=0; x.cur=0; x._curMan=true; x.ytd=r2(x._pYtd||0); } });
  }
  if(p.deductions.length||p.seen.deductions){
    p.deductions.forEach(d=>{
      let row=take(F.deductions,"name",d.name);
      if(!row){ row={...ST_BLANK.deductions,name:d.name}; F.deductions.push(row); used.add(row); }
      if(d.pretax&&!row.pretax) row.pretax=d.pretax;
      row.eeCur=d.eeCur; row._eeMan=true;
      if(d.eeYtd!=null){ row.eeYtd=d.eeYtd; row._eeyMan=true; } else { row.eeYtd=r2((row._pYtdEE||0)+row.eeCur); row._eeyMan=false; }
      if(d.erCur!=null){ row.erCur=d.erCur; row._erMan=true; }
      if(d.erYtd!=null) row.erYtd=d.erYtd;
    });
    F.deductions.forEach(x=>{ if(!used.has(x)) unmatched.push(x.name||"(deduction)"); });
  }
  if(p.taxes.length||p.seen.taxes){
    p.taxes.forEach(t=>{
      let row=take(F.taxes,"name",t.name);
      if(!row){ row={...ST_BLANK.taxes,name:t.name}; F.taxes.push(row); used.add(row); }
      row.cur=t.cur; row._man=true;
      if(t.ytd!=null){ row.ytd=t.ytd; row._ytdMan=true; } else { row.ytd=r2((row._pYtd||0)+row.cur); row._ytdMan=false; }
    });
    F.taxes.forEach(x=>{ if(!used.has(x)) unmatched.push(x.name||"(tax)"); });
  }
  p.pto.forEach(t=>{
    let row=take(F.pto,"plan",t.plan);
    if(!row){ row={...ST_BLANK.pto,plan:t.plan}; F.pto.push(row); used.add(row); }
    row.taken=t.taken; row.cur=t.cur; row.bal=t.bal;
  });
  stAutofill();
  const s=stSum(), t=p.totals, checks=[];
  const chk=(label,read,printed)=>{ if(printed==null) return; checks.push({label,read:r2(read),printed:r2(printed),ok:Math.abs(read-printed)<=0.05}); };
  if(t.gross) chk("Gross",s.g,t.gross[0]);
  if(t.tax) chk("Taxes",s.tax,t.tax[0]);
  if(t.ded) chk("Deductions",s.eeDed,t.ded[0]);
  if(t.net) chk("Net pay",s.cur.net,t.net[0]);
  F.scan={checks,unmatched,raw:rows,counts:{e:p.earnings.length,d:p.deductions.length,t:p.taxes.length}};
  scanCtx=null;
  renderSheet();
}

// ---- receipt: review, then log as an expense ----
function scanReceiptReview(rows){
  const p=parseReceipt(rows);
  S.scanMap=S.scanMap||{};
  const mem=S.scanMap[scanNorm(p.merchant)]||{};
  const opts=[];
  const grp=(label,kind,arr)=>{ if(arr&&arr.length) opts.push(`<optgroup label="${label}">${arr.map(x=>`<option value="${kind}:${x.id}" ${mem.tgt===kind+":"+x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</optgroup>`); };
  grp("Misc","misc",S.misc); grp("Health","health",S.health); grp("Transportation","transport",S.transport);
  grp("Bank account (direct)","cash",S.cash); grp("Credit card (charge)","credit",S.credit);

        <div class="sec" style="margin-top:0">What matters most right now?</div>

        <button onclick="rebalanceApply('cash')">💵 &nbsp;Free up spending cash</button>

        <button class="d" onclick="closeSheet()">Cancel</button>

    </div>`;

function rebalanceApply(priority){
  const clean={...S}; delete clean.__undo;
  const snapshot=JSON.stringify(clean);
  const c=calc();
  const income=c.monthNetMin;             // plan against the lean month
  const changes=[];
  const variable=()=>[...S.misc,...(S.health||[]),...(S.transport||[])];
  const varTotal=()=>variable().reduce((s,m)=>s+m.budget,0);
  const billTotal=()=>S.monthly.reduce((s,b)=>s+payAmt(b),0);
  let gap=income-(billTotal()+varTotal());  // negative = short

  if(gap<0){
    // Short. Free money up — order depends on priority.
    const cutBillsToMin=()=>{
      // bills where you're paying above the minimum can drop back
      const over=S.monthly.filter(b=>b.minAmt>0&&payAmt(b)>b.minAmt+0.005)
        .sort((a,b)=>(a.apr||0)-(b.apr||0)); // give up the lowest-APR extra payments first
      for(const b of over){
        if(gap>=0) break;
        const cur=payAmt(b), room=cur-b.minAmt, take=Math.min(room,-gap);
        const nv=Math.round((cur-take)*100)/100;
        S.monthly=S.monthly.map(x=>x.id===b.id?{...x,amt:nv,schedAmt:0}:x);
        changes.push(`${b.name}: payment ${fmt(cur)} → ${fmt(nv)} (minimum is ${fmt(b.minAmt)})`);
        gap+=take;
      }
    };
    const trimVariable=()=>{
      if(gap>=0) return;
      const tot=varTotal(); if(tot<=0) return;
      const need=Math.min(-gap,tot);
      const ratio=(tot-need)/tot;
      ["misc","health","transport"].forEach(k=>{
        S[k]=(S[k]||[]).map(m=>{
          if(m.budget<=0) return m;
          const nv=Math.max(0,Math.round(m.budget*ratio*100)/100);
          if(Math.abs(nv-m.budget)>0.005) changes.push(`${m.name} budget ${fmt(m.budget)} → ${fmt(nv)}`);
          return {...m,budget:nv};
        });
      });
      gap+=need;
    };
    if(priority==="debt"){ trimVariable(); cutBillsToMin(); }
    else { cutBillsToMin(); trimVariable(); }
    if(gap<-0.5) changes.push(`⚠ Still short ${fmt(-gap)} after trimming everything adjustable. Income needs to rise or a fixed bill needs to go.`);
  } else if(gap>0.5){
    // Surplus. Put it to work.
    if(priority==="debt"){
      const target=[...S.monthly.filter(b=>(b.debt||0)>0)].sort((a,b)=>(b.apr||0)-(a.apr||0))[0];
      if(target){
        const cur=payAmt(target), nv=Math.round((cur+gap)*100)/100;
        S.monthly=S.monthly.map(x=>x.id===target.id?{...x,amt:nv,schedAmt:0}:x);
        const before=totalInterest(target.debt,target.apr,cur), after=totalInterest(target.debt,target.apr,nv);
        changes.push(`${target.name} (${target.apr||0}% APR): payment ${fmt(cur)} → ${fmt(nv)}, putting your ${fmt(gap)} surplus against your priciest debt`);
        if(before!==null&&after!==null&&before-after>0.5) changes.push(`↳ saves about ${fmt(before-after)} in interest`);
      } else changes.push(`You have ${fmt(gap)} spare and no debt to attack — that surplus is free to save or spend.`);
    } else if(priority==="savings"){
      changes.push(`You have ${fmt(gap)} spare each lean month. Move it to savings on payday — the app won't do transfers for you, but "Move money" under + makes it one tap.`);
    } else {
      changes.push(`You have ${fmt(gap)} spare each lean month. Nothing needs cutting — that's genuinely free cash.`);
    }
  } else {
    changes.push("Your budget already lines up with your minimum income — nothing worth changing.");
  }
  S.__undo={snapshot,ts:Date.now(),changes};
  persist(); checkAlerts(); closeSheet(); render();
  document.getElementById("sheetHost").innerHTML=`
    <div class="overlay center" onclick="if(event.target===this)closeSheet()">
      <div class="menu" style="padding:16px;max-height:82vh;overflow-y:auto">
        <div style="font-weight:700;font-size:15px;margin-bottom:10px">Rebalanced</div>
        <div style="font-size:13px;line-height:1.6">${changes.length?changes.map(x=>"• "+x).join("<br><br>"):"No changes needed."}</div>
        <div class="hint" style="margin-top:12px">A backup was saved automatically. Use the bar at the top of the app to undo or keep this.</div>
        <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn" style="width:auto" onclick="closeSheet()">OK</button></div>
      </div>
    </div>`;
}

function analyzeBudget(){
  const c=calc();
  const monthBudget=c.mTotal+c.miscBudget;
  const incMin=c.monthNetMin, incMax=c.monthNetMax;
  const recs=[];
  // income vs budget
  if(incMin>0){
    const gapMin=incMin-monthBudget;
    if(gapMin<0) recs.push(`⚠ In your leanest month you're short ${fmt(-gapMin)} — planned spending (${fmt(monthBudget)}) exceeds minimum take-home (${fmt(incMin)}). Trim variable categories or a bill's budgeted payment.`);
    else recs.push(`✓ Even in a lean month you clear ${fmt(gapMin)} after all bills + budgets.`);
  }
  // over-budget categories
  [["Misc",S.misc],["Health",S.health||[]],["Transportation",S.transport||[]]].forEach(([label,arr])=>{
    arr.forEach(m=>{ if(m.budget>0&&m.spent>m.budget) recs.push(`• ${label}: "${m.name}" is over by ${fmt(m.spent-m.budget)}.`); });
  });
  // bills paying above minimum (schedAmt) — highlight potential slack
  const overpay=S.monthly.filter(b=>b.schedAmt>0&&b.schedAmt>b.amt);
  if(overpay.length){
    const extra=overpay.reduce((s,b)=>s+(b.schedAmt-b.amt),0);
    recs.push(`• You're budgeting ${fmt(extra)}/mo above the minimums on ${overpay.length} bill${overpay.length>1?"s":""} (${overpay.map(b=>b.name).join(", ")}). Good for cutting interest — but if a lean month hits, dropping to minimums frees up that cash.`);
  }
  // high-APR debt
  const hi=[...S.credit.filter(x=>x.debt>0&&x.apr>=20)].sort((a,b)=>b.apr-a.apr);
  if(hi.length) recs.push(`• Highest-APR debt: ${hi[0].name} at ${hi[0].apr}%. Extra dollars there save the most interest.`);
  // savings check
  if(c.savingsTotal<monthBudget) recs.push(`• Emergency cushion (${fmt(c.savingsTotal)}) is under one month of expenses (${fmt(monthBudget)}). Building it up protects the rest of this plan.`);
  const body=recs.length?recs.join("<br><br>"):"Everything looks balanced — no red flags in your current budget.";
  const hasAI = typeof window!=="undefined" && window.Android && window.Android.askAI;
  document.getElementById("sheetHost").innerHTML=`
    <div class="overlay center" onclick="if(event.target===this)closeSheet()">
      <div class="menu" style="padding:16px;max-height:82vh;overflow-y:auto">

function saveExpense(){
  const amt=Number(F.amt||0); if(!(amt>0)){ alert("Enter an amount."); return; }
  checkpoint();
  const name=titleCase(F.name||"Expense");
  if(!S.expenseNames) S.expenseNames=[];
  if(name&&!S.expenseNames.includes(name)) S.expenseNames.push(name);
  const cat=editing.cat, id=editing.id;
  if(cat==="misc"||cat==="health"||cat==="transport"){
    S[cat]=S[cat].map(x=>x.id===id?{...x,spent:Math.round((x.spent+amt)*100)/100}:x);
    if(cat==="health"){ const h=S.health.find(x=>x.id===id); S.healthLog=[{id:Date.now(),ts:Date.now(),name,amt,cat:h.cat||"medical"},...(S.healthLog||[])].slice(0,300); }
    // optional: also deduct from a chosen account or card
    if(F.payFrom){
      const [pk,pidRaw]=F.payFrom.split(":"); const pid=Number(pidRaw);
      if(pk==="cash"){ const a=S.cash.find(x=>x.id===pid); if(a){ S.cash=S.cash.map(x=>x.id===pid?{...x,amt:Math.round((x.amt-amt)*100)/100}:x); if(a.link) propagateLink(a.link,a.amt-amt); addLog({name:a.name,action:"expense",delta:-amt}); } }
      else if(pk==="credit"){ const cc=S.credit.find(x=>x.id===pid); if(cc){ const nd=Math.round((cc.debt+amt)*100)/100; S.credit=S.credit.map(x=>x.id===pid?{...x,debt:nd}:x); if(cc.link) propagateLink(cc.link,nd); addLog({name:cc.name,action:"charged",delta:amt,cat:"credit"}); } }
    }
  } else if(cat==="cash"){
    const a=S.cash.find(x=>x.id===id);
    S.cash=S.cash.map(x=>x.id===id?{...x,amt:Math.round((x.amt-amt)*100)/100}:x);
    if(a&&a.link) propagateLink(a.link,a.amt-amt);
  } else if(cat==="credit"){
    const cc=S.credit.find(x=>x.id===id);
    const nd=Math.round((cc.debt+amt)*100)/100;
    S.credit=S.credit.map(x=>x.id===id?{...x,debt:nd}:x);
    if(cc.link) propagateLink(cc.link,nd);
  }
  addLog({name,action:"expense",delta:cat==="cash"?-amt:amt,cat,...(F.ts?{ts:F.ts}:{})});
  persist(); checkAlerts();
  // if this expense pushed a budget category over, optionally offer to rebalance
  if(cat==="misc"||cat==="health"||cat==="transport"){
    const item=(S[cat]||[]).find(x=>x.id===id);
    if(item&&item.budget>0&&item.spent>item.budget){
      render();
      if(maybeOfferCompensate(item)) return;
    }
  }
  closeSheet(); render();
}

function savePayBill(){
  const amt=Number(F.amt||0); if(!(amt>0)){ alert("Enter an amount."); return; }
  if(!F.from){ alert("Choose an account to pay from."); return; }
  checkpoint();
  const {kind,id}=editing; const b=S[kind].find(x=>x.id===id);
  const [pk,pidRaw]=F.from.split(":"); const pid=Number(pidRaw);
  if(pk==="cash"){
    const a=S.cash.find(x=>x.id===pid);
    S.cash=S.cash.map(x=>x.id===pid?{...x,amt:Math.round((x.amt-amt)*100)/100}:x);
    if(a.link) propagateLink(a.link,a.amt-amt);
    addLog({name:a.name,action:"bill payment",delta:-amt,cat:"cash"});
  } else {
    const cc=S.credit.find(x=>x.id===pid);
    const nd=Math.round((cc.debt+amt)*100)/100;
    S.credit=S.credit.map(x=>x.id===pid?{...x,debt:nd}:x);
    if(cc.link) propagateLink(cc.link,nd);
    addLog({name:cc.name,action:"charged",delta:amt,cat:"credit"});
  }
  // reduce this bill's own balance if it carries one, and optionally mark paid
  let newDebt=null;
  S[kind]=S[kind].map(x=>{
    if(x.id!==id) return x;
    const nx={...x};
    if((nx.debt||0)>0){ nx.debt=Math.max(0,Math.round((nx.debt-amt)*100)/100); newDebt=nx.debt; }
    if(F.markPaid) nx.paid=true;
    return nx;
  });
  // a bill that shares a link with a card/loan updates that record too — so a payoff
  // shows up on the Debt tab, Accounts, and the bill list at the same time
  if(newDebt!==null&&b.link) propagateLink(b.link,newDebt);
  addLog({name:b.name,action:"paid",delta:-amt,cat:kind});
  persist(); checkAlerts(); closeSheet(); render();
  banner=`Paid ${b.name} — ${fmt(amt)}`; render();
}

function saveMoveMoney(){
  const amt=Number(F.amt||0); if(!(amt>0)){ alert("Enter an amount."); return; }
  checkpoint();
  const fromId=editing.fromId, toId=F.toId;
  const from=S.cash.find(a=>a.id===fromId), to=S.cash.find(a=>a.id===toId);
  if(!to){ alert("Choose a destination account."); return; }
  if(amt>from.amt && !confirm(`That's more than ${from.name} holds (${fmt(from.amt)}). Move anyway?`)) return;
  S.cash=S.cash.map(a=>{
    if(a.id===fromId) return {...a,amt:Math.round((a.amt-amt)*100)/100};
    if(a.id===toId) return {...a,amt:Math.round((a.amt+amt)*100)/100};
    return a;
  });
  if(from.link) propagateLink(from.link,from.amt-amt);
  if(to.link) propagateLink(to.link,to.amt+amt);
  addLog({name:`${from.name} → ${to.name}`,action:"moved",delta:amt,cat:"cash"});
  persist(); checkAlerts(); closeSheet(); render();
  banner=`Moved ${fmt(amt)} from ${from.name} to ${to.name}`; render();
}

function photoPick(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    // downscale so localStorage stays small
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas");
      const s=Math.min(1,256/Math.max(img.width,img.height));
      cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      P.photo=cv.toDataURL("image/jpeg",0.8);
      renderProfilePage();
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}

// all pay labels for a job = rate names + label-rate names
function jobLabelOptions(j){
  const names=[...(j.rates||[]).map(r=>({name:r.name,rate:r.rate||0})),...(j.labelRates||[]).map(r=>({name:r.name,rate:r.rate||0}))];
  const seen={}; return names.filter(x=>{ if(seen[x.name])return false; seen[x.name]=1; return true; });
}
// When a job's pay period has passed its payday, move that period's schedule into
// history and clear the live schedule so a fresh period starts blank.
function archiveExpiredSchedules(){
  let changed=false;
  const today=new Date(); today.setHours(0,0,0,0);
  S.jobs.forEach(j=>{
    if(!j.payAnchor||!(j.schedule||[]).length) return;
    // the payday for the current period; if it's already passed, the period is over
    const pd=nextPaydayFreq(j.payAnchor,j.freq); if(!pd) return;
    const step=FREQ_DAYS[j.freq]||14;
    // start of the current (upcoming) period = payday minus one period length
    const periodStart=new Date(pd); periodStart.setDate(periodStart.getDate()-step);
    // any schedule entries dated before this period's start belong to a finished period
    const oldEntries=j.schedule.filter(e=>e.date && new Date(e.date+"T12:00")<periodStart);
    if(oldEntries.length){
      const gross=scheduleGrossFor(j,oldEntries);
      j.scheduleArchive=[{id:Date.now()+Math.random(),ts:Date.now(),endedBefore:periodStart.toISOString().slice(0,10),entries:oldEntries,gross,net:gross*(1-(j.pct||0)/100)},...(j.scheduleArchive||[])].slice(0,60);
      j.schedule=j.schedule.filter(e=>!(e.date && new Date(e.date+"T12:00")<periodStart));
      changed=true;
    }
  });
  if(changed) persist();
}
function scheduleGrossFor(j,entries){
  const opts={}; [...(j.rates||[]),...(j.labelRates||[])].forEach(r=>opts[r.name]=r.rate||0);
  return (entries||[]).reduce((s,e)=>s+(opts[e.label]||0)*(e.hours||0),0);
}

function schedAdd(jid){ const t=new Date().toISOString().slice(0,10); const j=S.jobs.find(x=>x.id===jid); const o=jobLabelOptions(j); S.jobs=S.jobs.map(x=>x.id!==jid?x:{...x,schedule:[...(x.schedule||[]),{date:t,label:o[0]?.name||"Base",hours:0}]}); persist(); openSchedule(jid); }
function schedDel(jid,i){ S.jobs=S.jobs.map(x=>x.id!==jid?x:{...x,schedule:x.schedule.filter((_,k)=>k!==i)}); persist(); openSchedule(jid); }
function schedSet(jid,i,k,v){
  S.jobs=S.jobs.map(x=>x.id!==jid?x:{...x,schedule:x.schedule.map((e,k2)=>k2===i?{...e,[k]:k==="hours"?(parseFloat(v)||0):v}:e)});
  persist();
  if(k!=="hours") openSchedule(jid);
  else { const j=S.jobs.find(x=>x.id===jid); const est=scheduleGross(j); const g=document.getElementById("schedGross"); if(g) g.textContent=fmt(est.gross); const n=document.getElementById("schedNet"); if(n) n.textContent=fmt(est.gross*(1-(j.pct||0)/100)); }
}
// scheduled gross for the current pay period
function scheduleGross(j){
  const opts={}; jobLabelOptions(j).forEach(o=>opts[o.name]=o.rate);
  const gross=(j.schedule||[]).reduce((s,e)=>s+(opts[e.label]||0)*(e.hours||0),0);
  return {gross};

function bar(pct,color){ return `<div class="bar"><div style="width:${Math.min(100,pct)}%;background:${color}"></div></div>`; }
function krow(label,value,cls="",big=false,top=false){
  return `<div class="krow ${big?"big":""} ${top?"top":""}"><div class="kl">${label}</div><div class="kv ${cls}">${value}</div></div>`;
}

    <div><div class="stat-l">Total Cash</div><div class="stat-v">${fmt(c.cashTotal)}</div></div>
    <div><div class="stat-l">Total Debt</div><div class="stat-v r">${fmt(c.totalDebt)}</div></div>
    <div><div class="stat-l">Net Worth</div><div class="stat-v ${c.netWorth>=0?"g":"r"}">${fmt(c.netWorth)}</div></div>`;
