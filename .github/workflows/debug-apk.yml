# Builds a debug APK on every push (or by hand from the Actions tab). Pushes to
# master also publish it as a GitHub Release, so it can be downloaded and installed
# straight from a phone. Other branches only check that the code compiles and keep
# the APK with the run; they never publish a Release.
#
# One-time setup: add a repository secret named DEBUG_KEYSTORE_B64 holding the
# base64 of the PC's debug key (C:\Users\<you>\.android\debug.keystore), so
# these builds install over the app already on the phone and the data stays.
# Until that secret exists, the workflow still builds (to check the code
# compiles) but publishes no Release.
name: Debug APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore debug signing key
        id: key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set. Building with a throwaway key; no Release will be published."
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KS="$RUNNER_TEMP/debug.keystore"
          echo "$DEBUG_KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$KS"
          # fail now, with a clear message, if the secret isn't a working debug key
          if ! keytool -list -keystore "$KS" -storepass android -alias androiddebugkey > /dev/null; then
            echo "::error::DEBUG_KEYSTORE_B64 isn't a readable debug key (alias androiddebugkey, password android). Copy it again from the PC."
            exit 1
          fi
          echo "LEDGER_DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "have_key=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Check the APK is signed with the PC key
        if: steps.key.outputs.have_key == 'true'
        run: |
          WANT=$(keytool -list -v -keystore "$LEDGER_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256 digest' | sed 's/.*: *//')
          echo "PC key:   $WANT"
          echo "APK cert: $GOT"
          if [ -z "$WANT" ] || [ "$WANT" != "$GOT" ]; then
            echo "::error::The APK isn't signed with the PC debug key, so it wouldn't install over the app on the phone."
            exit 1
          fi

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: ledger-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as a Release
        if: steps.key.outputs.have_key == 'true' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          APK="ledger-debug-$N.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "debug-$N" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Ledger debug build $N" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s). Install over the existing app; don't uninstall first."
